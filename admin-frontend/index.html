<style>
  :root{
    --navy:#0F3D2E;
    --navy-2:#14503D;
    --sage:#1D9E73;
    --sage-dark:#14503D;
    --ochre:#1D9E73;
    --bg:#EFF7F2;
    --panel:#FFFFFF;
    --line:#D7E7DE;
    --text:#16241C;
    --muted:#5B7A6C;
    --danger:#B5542A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .brand h1{font-family:'Poppins',sans-serif; font-weight:700;}
  .app{display:flex; min-height:100vh;}

  .auth-wrap{
    display:flex; align-items:center; justify-content:center; width:100%; min-height:100vh; padding:24px;
    background: radial-gradient(circle at 15% 20%, rgba(124,156,130,.25), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(201,138,62,.18), transparent 45%), var(--navy);
  }
  .auth-card{ width:100%; max-width:400px; background:var(--panel); border-radius:16px; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .brand svg{width:38px; height:38px; display:block; flex-shrink:0;}
  .brand h1{font-size:23px; color:var(--navy);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; background:#fbfcfb;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .btn{ padding:10px 16px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn:hover{background:var(--navy-2);}
  .btn.ochre{background:var(--ochre);}
  .btn.ochre:hover{background:#178a63;}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn.danger{background:transparent; color:var(--danger); border:1.5px solid #e6c3b3;}
  .btn.full{width:100%;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:6px;}
  .error-msg{color:var(--danger); font-size:13px; margin:-6px 0 14px;}
  .hint{font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5;}

  .sidebar{ width:190px; background:var(--navy); color:#EAF0EE; padding:20px 14px; flex-shrink:0; display:flex; flex-direction:column; }
  .sidebar .brand{ color:#fff; margin-bottom:4px; gap:8px; }
  .sidebar .brand svg{ width:30px; height:30px; }
  .sidebar .brand h1{ color:#fff; font-size:16px; letter-spacing:.02em; }
  .brand-tagline{ font-size:8.5px; color:#7FA394; letter-spacing:.08em; text-transform:uppercase; margin:0 0 22px 38px; margin-top:-4px; }
  .nav-item{
    padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; color:#B7C9C2; margin-bottom:2px;
    display:flex; align-items:center; gap:9px;
  }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:.85; }
  .nav-item.active{ background:rgba(255,255,255,.12); color:#fff; }
  .nav-item.active svg{ opacity:1; }
  .nav-item .badge-count{ background:var(--ochre); color:#fff; font-size:9.5px; font-weight:700; border-radius:20px; padding:1px 6px; margin-left:auto; }
  .sidebar .spacer{flex:1;}
  .lang-switch{display:flex; gap:4px; margin-top:10px; margin-bottom:12px;}
  .lang-switch button{
    background:transparent; border:1px solid rgba(255,255,255,.22); border-radius:6px; padding:4px 9px;
    font-size:11px; font-weight:700; color:#9FB3AE; cursor:pointer; font-family:inherit;
  }
  .lang-switch button.active{background:var(--ochre,#C98A3E); border-color:var(--ochre,#C98A3E); color:#fff;}
  .who{font-size:11px; color:#9FB3AE; line-height:1.5; margin-bottom:8px; padding-left:2px;}
  .logout{font-size:11px; color:#E7B98C; cursor:pointer; text-decoration:underline; padding-left:2px;}
  .sidebar-footer{ display:flex; align-items:center; gap:6px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); }
  .sidebar-footer svg{ width:16px; height:16px; }
  .sidebar-footer .footer-text{ font-size:10px; color:#7FA394; }

  .main{flex:1; padding:24px 28px; min-width:0;}
  .topbar-row{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .topbar-row .spacer{ flex:1; }
  .topbar-bell{ position:relative; width:36px; height:36px; border-radius:50%; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .topbar-bell svg{ width:17px; height:17px; }
  .topbar-bell-badge{ position:absolute; top:-3px; right:-3px; background:var(--danger); color:#fff; font-size:9px; font-weight:700; border-radius:20px; padding:1px 5px; border:2px solid var(--bg); }
  .topbar-avatar{ width:34px; height:34px; border-radius:50%; background:var(--sage); color:#fff; font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center; }
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;}
  .page-head h2{font-size:24px; color:var(--navy);}
  .page-head p{color:var(--muted); font-size:13px; margin-top:4px;}

  .stat-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; min-width:0; }
  .stat-card .value{ font-family:'Fraunces',serif; font-size:22px; color:var(--navy); line-height:1.15; }
  .stat-card .label{ font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-card .sub-label{ font-size:10px; color:var(--sage-dark); margin-top:5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-icon{
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    margin-bottom:8px; background:var(--bg);
  }
  .stat-icon svg{ width:15px; height:15px; }
  .stat-icon-bookings{ background:#DCE7F5; }
  .stat-icon-completed{ background:#DEEFE0; }
  .stat-icon-workers{ background:#E4E0F5; }
  .stat-icon-revenue{ background:#DEEFE0; }
  .stat-icon-satisfaction{ background:#F6EBD2; }
  .stat-icon-pending{ background:#F2DADA; }

  @media (max-width:1100px){ .stat-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:640px){ .stat-grid{ grid-template-columns:repeat(2, 1fr); } }

  .dash-grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:1000px){ .dash-grid{ grid-template-columns:1fr; } }
  .panel-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .panel-head{ margin-bottom:14px; }
  .panel-head h3{ font-size:15px; color:var(--navy); }

  .booking-list{ display:flex; flex-direction:column; gap:10px; }
  .booking-row{ display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  .chat-list-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .chat-list-row:hover{ background:#F5F8F6; }
  .chat-list-row.active{ background:var(--bg); }
  .booking-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--sage); color:#fff; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .status-pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; margin-top:3px; }
  .status-pending{ background:#F2DADA; color:#A13A3A; }
  .status-assigned{ background:#E4E0F5; color:#5B3F9E; }
  .status-in_progress{ background:#DCE7F5; color:#2C5C8A; }
  .status-done{ background:#DEEFE0; color:#2E7D46; }

  .review-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .services-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .apps-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .app-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
    cursor:pointer; transition:border-color .15s, box-shadow .15s;
  }
  .app-card:hover{ border-color:var(--sage); box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .app-card-avatar{
    width:40px; height:40px; border-radius:50%; background:var(--sage); color:#fff; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .service-price-card .field input{ padding:7px 9px; font-size:13px; }
  .checklist-icon-btn{
    background:#F0F4F2; border:1px solid var(--line); border-radius:5px; width:22px; height:22px; font-size:11px;
    cursor:pointer; color:var(--navy); flex-shrink:0; padding:0; line-height:1;
  }
  .checklist-icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .review-card{ border:1px solid var(--line); border-radius:8px; padding:14px; }

  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 14px; background:#F5F8F6; border-bottom:1px solid var(--line);}
  td{padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .empty-state{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:40px; text-align:center; color:var(--muted); }
  .row-actions{display:flex; gap:8px;}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(18,48,63,.45); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal{ background:#fff; border-radius:14px; padding:26px; width:100%; max-width:420px; }
  .modal.modal-wide{ max-width:520px; max-height:85vh; overflow-y:auto; }
  .detail-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .detail-row span{ color:var(--muted); flex-shrink:0; }
  .detail-row strong{ text-align:right; font-weight:600; color:var(--navy); }
  .modal h3{margin-bottom:14px; color:var(--navy);}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:12px 18px;
    border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60;
  }

  @media (max-width:800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; flex-wrap:wrap; gap:10px 16px; }
    .sidebar .brand{ margin-bottom:0; }
    .sidebar .spacer{ display:none; }
    .sidebar .who{ display:none; }
    .brand-tagline{ display:none; }
    .sidebar-footer{ display:none; }
    .main{ padding:20px; }
    .topbar-row .who-name{ display:none; }
  }
</style>
</head>

  attachHandlers();
  if(state.token && state.page === 'dashboard' && state.liveLocations){
    initLiveMap(state.liveLocations);
  }

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers||{}),
    },
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Bir hata oluştu.');
  return data;
}

        <div class="field"><label>${T.passwordLabel}</label><input name="password" type="password" required /></div>
        ${state.authError ? `<div class="error-msg">${state.authError}</div>` : ''}
        <button class="btn ochre full" type="submit">${T.loginBtn}</button>
      </form>
    </div>
  </div>`;
}

let liveMapInstance = null;
function initLiveMap(workers){
  const container = document.getElementById('live-map');
  if(!container || typeof L === 'undefined') return;
  if(liveMapInstance){ try{ liveMapInstance.remove(); }catch(e){} liveMapInstance = null; }
  if(!workers || workers.length === 0) return;

  const center = [workers[0].current_lat, workers[0].current_lng];
  const map = L.map('live-map', { zoomControl: true }).setView(center, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  const bounds = [];
  workers.forEach(w => {
    const color = w.isBusy ? '#C98A3E' : '#1D9E73';
    const icon = L.divIcon({
      className: '', html: `<div style="width:16px; height:16px; border-radius:50%; background:${color}; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35);"></div>`,
      iconSize: [16,16], iconAnchor: [8,8],
    });
    L.marker([w.current_lat, w.current_lng], { icon }).addTo(map)
      .bindPopup(`<strong>${w.name}</strong><br/>${w.current_city||''}<br/>${w.isBusy ? T.legendBusy : T.legendAvailable}`);
    bounds.push([w.current_lat, w.current_lng]);
  });
  if(bounds.length > 1) map.fitBounds(bounds, { padding: [30,30] });
  liveMapInstance = map;
}

function renderRevenuePanel(){
  const r = state.revenue;
  if(!r) return `<div class="panel-card" style="margin-bottom:16px;"><div class="empty-state" style="margin:0;">…</div></div>`;

  const w = 700, h = 200, padX = 30, padY = 20;
  const max = Math.max(1, ...r.series.map(s => s.total));
  const stepX = (w - padX*2) / Math.max(1, r.series.length - 1);
  const points = r.series.map((s,i) => {
    const x = padX + i*stepX;
    const y = h - padY - (s.total/max) * (h - padY*2);
    return { x, y, s };
  });
  const linePath = points.map((p,i) => `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${points[points.length-1].x.toFixed(1)} ${h-padY} L ${points[0].x.toFixed(1)} ${h-padY} Z`;

  const changeColor = r.percentChange === null ? 'var(--muted)' : r.percentChange >= 0 ? 'var(--sage-dark)' : 'var(--danger)';
  const changeSign = r.percentChange !== null && r.percentChange >= 0 ? '↑' : '↓';

  return `
  <div class="panel-card" style="margin-bottom:16px;">
    <div class="panel-head" style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h3>${T.revenueOverviewTitle}</h3>
        <div style="font-family:'Fraunces',serif; font-size:26px; color:var(--navy); margin-top:6px;">${r.totalRevenue} €</div>
        ${r.percentChange !== null ? `<div style="font-size:12px; color:${changeColor}; margin-top:2px;">${changeSign} %${Math.abs(r.percentChange)} ${T.revenueVsPrevious}</div>` : ''}
      </div>
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">
      <defs>
        <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1D9E73" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#1D9E73" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#revGrad)" />
      <path d="${linePath}" fill="none" stroke="#1D9E73" stroke-width="2.5" />
      ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#0F3D2E" />`).join('')}
      ${points.map(p => `<text x="${p.x.toFixed(1)}" y="${h-4}" font-size="10" fill="#5B7A6C" text-anchor="middle">${new Date(p.s.date).toLocaleDateString('sr-Latn-ME',{weekday:'short'})}</text>`).join('')}
    </svg>
  </div>`;
}

/* ---- Alt sayfa: Genel Bakış (MICISTO'nun kendi kazancı) ---- */
function renderFinanceOverview(){
  const o = state.financeOverview;
  if(!o) return `<div class="empty-state">…</div>`;
  const w = 700, h = 160, padX = 24, padY = 16;
  const max = Math.max(1, ...o.series.map(s => s.commission));
  const stepX = (w - padX*2) / Math.max(1, o.series.length - 1);
  const points = o.series.map((s,i) => ({ x: padX+i*stepX, y: h-padY-(s.commission/max)*(h-padY*2), s }));
  const linePath = points.map((p,i) => `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  return `
  <div style="display:flex; gap:8px; margin-bottom:16px;">
    ${['day','week','month'].map(g => `<button class="btn ${state.financeGranularity===g?'ochre':'ghost'} btn-sm" data-finance-granularity="${g}">${T['granularity_'+g]}</button>`).join('')}
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:16px;">
    <div class="stat-card" data-open-tx="collected" style="cursor:pointer;">
      <div class="value" style="color:var(--sage-dark);">${o.collectedCommission} €</div>
      <div class="label">${T.financeCollected}</div>
      <div class="sub-label">${T.financeClickToView}</div>
    </div>
    <div class="stat-card" data-open-tx="pending" style="cursor:pointer;">
      <div class="value" style="color:#C98A3E;">${o.pendingCommission} €</div>
      <div class="label">${T.financePending}</div>
      <div class="sub-label">${T.financeClickToView}</div>
    </div>
  </div>
  <div class="panel-card">
    <div class="panel-head"><h3>${T.financeCommissionChartTitle}</h3></div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
      <path d="${linePath}" fill="none" stroke="#1D9E73" stroke-width="2.5" />
      ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#0F3D2E" />`).join('')}
      ${points.map((p,i) => i % Math.ceil(points.length/8||1) === 0 ? `<text x="${p.x.toFixed(1)}" y="${h-2}" font-size="9" fill="#5B7A6C" text-anchor="middle">${p.s.label.slice(5)}</text>` : '').join('')}
    </svg>
  </div>
  `;
}

  const parts = [];
  if(p.city) parts.push(p.city);
  if(p.service_key) parts.push(serviceLabel(p.service_key));
  if(p.start_hour !== null && p.end_hour !== null) parts.push(`${String(p.start_hour).padStart(2,'0')}:00–${String(p.end_hour).padStart(2,'0')}:00`);
  if(p.start_date || p.end_date) parts.push(`${p.start_date||'…'} – ${p.end_date||'…'}`);
  if(p.source === 'loyalty') parts.push('🎖️ Sadakat');
  if(p.source === 'referral') parts.push('🤝 Referans');
  return parts.length ? parts.join(' · ') : 'Genel';
}

function renderStaffTrendChart(st){
  const w = 700, h = 160, padX = 24, padY = 16;
  const max = Math.max(1, ...st.series.map(s => s.jobs));
  const stepX = (w - padX*2) / Math.max(1, st.series.length - 1);
  const points = st.series.map((s,i) => ({ x: padX+i*stepX, y: h-padY-(s.jobs/max)*(h-padY*2), s }));
  const linePath = points.map((p,i) => `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    <path d="${linePath}" fill="none" stroke="#5B3F9E" stroke-width="2.5" />
    ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#0F3D2E" />`).join('')}
    ${points.map((p,i) => i % Math.ceil(points.length/8||1) === 0 ? `<text x="${p.x.toFixed(1)}" y="${h-2}" font-size="9" fill="#5B7A6C" text-anchor="middle">${p.s.label.slice(5)}</text>` : '').join('')}
  </svg>`;
}

// yalnızca admin Dashboard'dayken çalışır, başka sayfaya geçince durur
// (gereksiz istek atmasın diye).
let liveMapPollInterval = null;
function startLiveMapPolling(){

  liveMapPollInterval = setInterval(() => {

  }, 20000);

}

let chatPollInterval = null;
// Destek sayfası açıkken ve bir sohbet seçiliyken, müşteriden gelen yeni
// mesajları görmek için sekmeyi kapatıp açmaya gerek kalmasın diye birkaç
// saniyede bir arka planda kontrol ediyoruz. Hem seçili sohbetin içeriğini
// hem soldaki listeyi (okunmamış sayaç/son mesaj) güncel tutuyor.
function startChatPolling(){
  stopChatPolling();
  chatPollInterval = setInterval(async () => {
    if(state.page !== 'support' || !state.token) return;
    try{
      if(state.activeChatUserId){
        const fresh = await api(`/admin/chats/${state.activeChatUserId}/messages`);
        if(!state.chatMessages || fresh.length !== state.chatMessages.length){
          state.chatMessages = fresh;
          const thread = document.getElementById('chat-thread');
          if(thread){
            thread.innerHTML = state.chatMessages.map(m => `
              <div style="align-self:${m.sender==='admin'?'flex-end':'flex-start'}; max-width:75%;">
                <div style="background:${m.sender==='admin'?'var(--navy)':'#F0F4F2'}; color:${m.sender==='admin'?'#fff':'var(--text)'}; padding:9px 13px; border-radius:12px; font-size:13.5px;">${m.message}</div>
                <div style="font-size:10px; color:var(--muted); margin-top:3px; text-align:${m.sender==='admin'?'right':'left'};">${new Date(m.created_at.replace(' ','T')).toLocaleString('sr-Latn-ME',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
              </div>
            `).join('');
            thread.scrollTop = thread.scrollHeight;
          }
        }
      }
      state.chats = await api('/admin/chats');
    }catch(e){ /* sessizce geç, bir sonraki denemede tekrar dener */ }
  }, 3500);
}
function stopChatPolling(){
  if(chatPollInterval){ clearInterval(chatPollInterval); chatPollInterval = null; }
}

function attachHandlers(){
  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(loginForm));
    try{
      const data = await api('/auth/admin-login', { method:'POST', body: JSON.stringify(fd) });
      state.token = data.token; state.user = data.user;
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUser', JSON.stringify(data.user));
      state.authError = '';
    }catch(err){ state.authError = err.message; render(); return; }
    // Giriş başarılı - panel artık gösterilmeli. Bundan sonraki veri
    // yüklemelerinden biri başarısız olsa bile (örn. backend'in en son hali
    // henüz deploy edilmediyse) kullanıcı panelde kalmalı, girişe geri
    // atılmamalı.
    render();
    try{ await loadDashboard(); }catch(err){ console.error('loadDashboard hata:', err); }
    try{ await loadRevenue(); }catch(err){ console.error('loadRevenue hata:', err); }
    try{ await loadLiveLocations(); startLiveMapPolling(); }catch(err){ console.error('loadLiveLocations hata:', err); }
    try{ await loadApplications(); }catch(err){ console.error('loadApplications hata:', err); }
  };

  document.querySelectorAll('[data-page]').forEach(el => el.onclick = async () => {
    state.page = el.dataset.page; render();
    if(state.page === 'dashboard'){ await loadDashboard(); await loadRevenue(); await loadLiveLocations(); startLiveMapPolling(); }
    else stopLiveMapPolling();
    if(state.page === 'applications') await loadApplications();
    if(state.page === 'bookings') await loadBookings(1);
    if(state.page === 'workers') await loadWorkers();
    if(state.page === 'customers') await loadCustomers();
    if(state.page === 'support'){ await loadChats(); startChatPolling(); }
    else stopChatPolling();
    if(state.page === 'services') await loadServicesData();
    if(state.page === 'finance') await loadFinanceSubPage();
    if(state.page === 'settings'){ await loadSettings(); await loadAdmins(); }
    if(state.page === 'marketing') await loadMarketingSubPage();
    if(state.page === 'analytics') await loadAnalytics();
    if(state.page === 'coverage') await loadCoverage();
    if(state.page === 'performance'){ await loadPerformanceSubPage(); startPerformancePolling(); }
    else stopPerformancePolling();
  });

  document.querySelectorAll('[data-performance-subpage]').forEach(el => el.onclick = async () => {
    state.performanceSubPage = el.dataset.performanceSubpage;
    await loadPerformanceSubPage();
  });

  document.querySelectorAll('[data-finance-subpage]').forEach(el => el.onclick = async () => {
    state.financeSubPage = el.dataset.financeSubpage;
    state.selectedFinanceStaffId = null;
    await loadFinanceSubPage();
  });

  document.querySelectorAll('[data-finance-granularity]').forEach(el => el.onclick = async () => {
    state.financeGranularity = el.dataset.financeGranularity;
    await loadFinanceOverview();
  });

  document.querySelectorAll('[data-open-tx]').forEach(el => el.onclick = async () => {
    await loadFinanceTx(el.dataset.openTx);
  });
  const closeTxModal = document.getElementById('close-tx-modal');
  if(closeTxModal) closeTxModal.onclick = () => { state.financeTxModal = null; render(); };
  const txBackdrop = document.getElementById('tx-modal-backdrop');
  if(txBackdrop) txBackdrop.onclick = (e) => { if(e.target===txBackdrop){ state.financeTxModal = null; render(); } };

  document.querySelectorAll('[data-open-staff-finance]').forEach(el => el.onclick = async () => {
    await loadStaffPeriods(el.dataset.openStaffFinance);
  });
  const backToStaffList = document.getElementById('back-to-staff-list');
  if(backToStaffList) backToStaffList.onclick = async () => {
    state.selectedFinanceStaffId = null; state.staffPeriods = null;
    await loadFinanceStaffList();
  };

  document.querySelectorAll('[data-mark-paid]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/finance/staff/${state.selectedFinanceStaffId}/periods/mark-paid`, {
        method:'POST',
        body: JSON.stringify({ periodStart: el.dataset.markPaid, periodEnd: el.dataset.markPaidEnd, amount: el.dataset.markPaidAmount }),
      });
      showToast(T.toastMarkedPaid);
      await loadStaffPeriods(state.selectedFinanceStaffId);
    }catch(err){ showToast(err.message); }
  });
  document.querySelectorAll('[data-unmark-paid]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/finance/staff/${state.selectedFinanceStaffId}/periods/unmark-paid`, {
        method:'POST', body: JSON.stringify({ periodStart: el.dataset.unmarkPaid }),
      });
      await loadStaffPeriods(state.selectedFinanceStaffId);
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-cancel-period]').forEach(el => el.onclick = async () => {
    state.financePeriod = el.dataset.cancelPeriod; state.financeOffset = 0;
    await loadFinanceCancellations();
  });
  const cancelPrev = document.getElementById('cancel-prev');
  if(cancelPrev) cancelPrev.onclick = async () => { state.financeOffset -= 1; await loadFinanceCancellations(); };
  const cancelNext = document.getElementById('cancel-next');
  if(cancelNext) cancelNext.onclick = async () => { state.financeOffset += 1; await loadFinanceCancellations(); };

  const refreshMapBtn = document.getElementById('refresh-map-btn');
  if(refreshMapBtn) refreshMapBtn.onclick = async () => { await loadLiveLocations(); };

  const financeExportBtn = document.getElementById('finance-export-btn');
  if(financeExportBtn) financeExportBtn.onclick = async () => {
    try{
      const res = await fetch(`${API}/admin/finance/export?period=${state.financePeriod}&offset=${state.financeOffset}`, {
        headers: { Authorization: 'Bearer ' + state.token },
      });
      if(!res.ok) throw new Error('İndirme başarısız.');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `micisto-finans-${state.financePeriod}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast(T.toastCsvExported);
    }catch(err){ showToast(err.message); }
  };

  const generalSettingsForm = document.getElementById('general-settings-form');
  if(generalSettingsForm) generalSettingsForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(generalSettingsForm));
    try{
      await api('/admin/settings', { method:'PUT', body: JSON.stringify({
        commissionRate: Number(fd.commissionRatePercent) / 100,
        payoutCycleDays: fd.payoutCycleDays,
      })});
      showToast(T.toastSettingsSaved);
      await loadSettings();
    }catch(err){ showToast(err.message); }
  };

  const changePasswordForm = document.getElementById('change-password-form');
  if(changePasswordForm) changePasswordForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(changePasswordForm));
    try{
      await api('/admin/account/password', { method:'PUT', body: JSON.stringify(fd) });
      state.settingsError = '';
      showToast(T.toastPasswordChanged);
      changePasswordForm.reset();
      render();
    }catch(err){ state.settingsError = err.message; render(); }
  };

  const addAdminForm = document.getElementById('add-admin-form');
  if(addAdminForm) addAdminForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(addAdminForm));
    try{
      await api('/admin/admins', { method:'POST', body: JSON.stringify(fd) });
      showToast(T.toastAdminCreated);
      await loadAdmins();
    }catch(err){ showToast(err.message); }
  };

  document.querySelectorAll('[data-delete-admin]').forEach(el => el.onclick = () => {
    state.deleteAdminTargetId = el.dataset.deleteAdmin;
    render();
  });
  const cancelDeleteAdmin = document.getElementById('cancel-delete-admin');
  if(cancelDeleteAdmin) cancelDeleteAdmin.onclick = () => { state.deleteAdminTargetId = null; render(); };
  const confirmDeleteAdmin = document.getElementById('confirm-delete-admin');
  if(confirmDeleteAdmin) confirmDeleteAdmin.onclick = async () => {
    try{
      await api(`/admin/admins/${state.deleteAdminTargetId}`, { method:'DELETE' });
      showToast(T.toastAdminDeleted);
      state.deleteAdminTargetId = null;
      await loadAdmins();
    }catch(err){ showToast(err.message); state.deleteAdminTargetId = null; render(); }
  };
  const deleteAdminBackdrop = document.getElementById('delete-admin-backdrop');
  if(deleteAdminBackdrop) deleteAdminBackdrop.onclick = (e) => { if(e.target===deleteAdminBackdrop){ state.deleteAdminTargetId = null; render(); } };

  document.querySelectorAll('[data-marketing-subpage]').forEach(el => el.onclick = async () => {
    state.marketingSubPage = el.dataset.marketingSubpage;
    await loadMarketingSubPage();
  });

  const addCampaignForm = document.getElementById('add-campaign-form');
  if(addCampaignForm) addCampaignForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(addCampaignForm));
    try{
      await api('/admin/marketing/ad-campaigns', { method:'POST', body: JSON.stringify(fd) });
      showToast(T.toastCampaignAdded);
      addCampaignForm.reset();
      await loadAdCampaigns();
    }catch(err){ showToast(err.message); }
  };
  document.querySelectorAll('[data-delete-campaign]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/marketing/ad-campaigns/${el.dataset.deleteCampaign}`, { method:'DELETE' });
      showToast(T.toastCampaignDeleted);
      await loadAdCampaigns();
    }catch(err){ showToast(err.message); }
  });

  const createPromoForm = document.getElementById('create-promo-form');
  if(createPromoForm) createPromoForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(createPromoForm));
    try{
      await api('/admin/marketing/promo-codes', { method:'POST', body: JSON.stringify(fd) });
      showToast(T.toastPromoCreated);
      createPromoForm.reset();
      await loadPromoCodes();
    }catch(err){ showToast(err.message); }
  };
  document.querySelectorAll('[data-toggle-promo]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/marketing/promo-codes/${el.dataset.togglePromo}/toggle`, { method:'PUT' });
      showToast(T.toastPromoToggled);
      await loadPromoCodes();
    }catch(err){ showToast(err.message); }
  });
  document.querySelectorAll('[data-delete-promo]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/marketing/promo-codes/${el.dataset.deletePromo}`, { method:'DELETE' });
      showToast(T.toastPromoDeleted);
      await loadPromoCodes();
    }catch(err){ showToast(err.message); }
  });

  const loyaltyMinOrdersInput = document.getElementById('loyalty-min-orders');
  if(loyaltyMinOrdersInput) loyaltyMinOrdersInput.onchange = async () => {
    state.loyaltyMinOrders = loyaltyMinOrdersInput.value;
    await loadLoyaltyCustomers();
  };
  const generateLoyaltyForm = document.getElementById('generate-loyalty-form');
  if(generateLoyaltyForm) generateLoyaltyForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(generateLoyaltyForm));
    try{
      const result = await api('/admin/marketing/promo-codes/generate-loyalty', { method:'POST', body: JSON.stringify({ ...fd, minOrders: state.loyaltyMinOrders }) });
      showToast(result.message);
      generateLoyaltyForm.reset();
      state.marketingSubPage = 'promos';
      await loadPromoCodes();
    }catch(err){ showToast(err.message); }
  };

  const generateReferralForm = document.getElementById('generate-referral-form');
  if(generateReferralForm) generateReferralForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(generateReferralForm));
    try{
      const result = await api('/admin/marketing/promo-codes/generate-referral', { method:'POST', body: JSON.stringify(fd) });
      showToast(result.message);
      generateReferralForm.reset();
      state.marketingSubPage = 'promos';
      await loadPromoCodes();
    }catch(err){ showToast(err.message); }
  };

  const addAreaForm = document.getElementById('add-area-form');
  if(addAreaForm) addAreaForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(addAreaForm));
    try{
      await api('/admin/coverage/areas', { method:'POST', body: JSON.stringify(fd) });
      addAreaForm.reset();
      await loadCoverage();
    }catch(err){ showToast(err.message); }
  };
  document.querySelectorAll('[data-toggle-area]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/coverage/areas/${el.dataset.toggleArea}/toggle`, { method:'PUT' });
      await loadCoverage();
    }catch(err){ showToast(err.message); }
  });
  document.querySelectorAll('[data-delete-area]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/coverage/areas/${el.dataset.deleteArea}`, { method:'DELETE' });
      await loadCoverage();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-open-chat]').forEach(el => el.onclick = async () => {
    await loadChatMessages(el.dataset.openChat);
  });

  const chatReplyForm = document.getElementById('chat-reply-form');
  if(chatReplyForm) chatReplyForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(chatReplyForm));
    if(!fd.message.trim()) return;
    try{
      await api(`/admin/chats/${state.activeChatUserId}/messages`, { method:'POST', body: JSON.stringify({ message: fd.message }) });
      await loadChatMessages(state.activeChatUserId);
      await loadChats();
    }catch(err){ showToast(err.message); }
  };

  document.querySelectorAll('[data-pricing-form]').forEach(form => form.onsubmit = async (e) => {
    e.preventDefault();
    const key = form.dataset.pricingForm;
    const fd = Object.fromEntries(new FormData(form));
    try{
      await api(`/admin/services/${key}/pricing`, { method:'PUT', body: JSON.stringify(fd) });
      showToast(T.savedToast);
      await loadServicesData();
    }catch(err){ showToast(err.message); }
  });

  const suppliesPricingForm = document.getElementById('supplies-pricing-form');
  if(suppliesPricingForm) suppliesPricingForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(suppliesPricingForm));
    try{
      await api('/admin/supplies-fees', { method:'PUT', body: JSON.stringify(fd) });
      showToast(T.savedToast);
      await loadServicesData();
    }catch(err){ showToast(err.message); }
  };

  document.querySelectorAll('[data-add-checklist]').forEach(form => form.onsubmit = async (e) => {
    e.preventDefault();
    const key = form.dataset.addChecklist;
    const fd = Object.fromEntries(new FormData(form));
    if(!fd.itemTextTr || !fd.itemTextTr.trim()) return;
    try{
      await api(`/admin/services/${key}/checklist`, { method:'POST', body: JSON.stringify({
        itemTextTr: fd.itemTextTr, itemTextEn: fd.itemTextEn, itemTextMe: fd.itemTextMe,
      })});
      form.reset();
      await loadServicesData();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-move-item]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/services/checklist/${el.dataset.moveItem}/move`, { method:'POST', body: JSON.stringify({ direction: el.dataset.moveDir }) });
      await loadServicesData();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-delete-item]').forEach(el => el.onclick = async () => {
    try{
      await api(`/admin/services/checklist/${el.dataset.deleteItem}`, { method:'DELETE' });
      await loadServicesData();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-booking-filter]').forEach(el => el.onclick = async () => {
    state.bookingsFilter = el.dataset.bookingFilter;
    await loadBookings(1);
  });
  const bookingPrev = document.getElementById('booking-prev-page');
  if(bookingPrev) bookingPrev.onclick = async () => { await loadBookings(state.bookings.page - 1); };
  const bookingNext = document.getElementById('booking-next-page');
  if(bookingNext) bookingNext.onclick = async () => { await loadBookings(state.bookings.page + 1); };

  const topbarBell = document.getElementById('topbar-bell');
  if(topbarBell) topbarBell.onclick = async () => {
    state.page = 'support'; render();
    await loadChats();
  };

  document.querySelectorAll('[data-admin-lang]').forEach(el => el.onclick = () => {
    state.lang = el.dataset.adminLang;
    localStorage.setItem('adminLang', state.lang);
    render();
  });

  const logout = document.getElementById('logout');
  if(logout) logout.onclick = () => {
    stopLiveMapPolling();
    stopChatPolling();
    stopPerformancePolling();
    localStorage.removeItem('adminToken'); localStorage.removeItem('adminUser');
    state.token = null; state.user = null; render();
  };

  document.querySelectorAll('[data-apps-filter]').forEach(el => el.onclick = async () => {
    state.applicationsFilter = el.dataset.appsFilter;
    await loadApplications();
  });

  document.querySelectorAll('[data-open-app-detail]').forEach(el => el.onclick = () => {
    state.appDetailId = el.dataset.openAppDetail;
    state.modal = 'app-detail';
    render();
  });

  document.querySelectorAll('[data-resend-code]').forEach(el => el.onclick = async () => {
    try{
      const result = await api(`/admin/staff-applications/${el.dataset.resendCode}/resend-code`, { method:'POST' });
      state.newCredentials = { activationCode: result.activationCode };
      state.modal = 'credentials';
      render();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-approve]').forEach(el => el.onclick = async () => {
    try{
      const result = await api(`/admin/staff-applications/${el.dataset.approve}/approve`, { method:'POST' });
      state.newCredentials = { activationCode: result.activationCode };
      state.modal = 'credentials';
      showToast(T.toastApproved);
      await loadApplications();
      render();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-reject]').forEach(el => el.onclick = () => {
    state.rejectTargetId = el.dataset.reject;
    state.modal = 'confirm-reject';
    render();
  });

  const modalCancel = document.getElementById('modal-cancel');
  if(modalCancel) modalCancel.onclick = () => { state.modal = null; state.rejectTargetId = null; render(); };
  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.onclick = () => { state.modal = null; state.newCredentials = null; state.appDetailId = null; render(); };

  const confirmReject = document.getElementById('modal-confirm-reject');
  if(confirmReject) confirmReject.onclick = async () => {
    try{
      await api(`/admin/staff-applications/${state.rejectTargetId}/reject`, { method:'POST' });
      showToast(T.toastRejected);
      state.modal = null; state.rejectTargetId = null;
      await loadApplications();
    }catch(err){ showToast(err.message); render(); }
  };
}

(async function init(){
  render();
  if(state.token){
    try{
      await loadDashboard();
    }catch(err){
      // loadDashboard başarısız oluyorsa token muhtemelen geçersiz/süresi dolmuş -
      // gerçekten çıkış yapılmalı.
      localStorage.removeItem('adminToken'); localStorage.removeItem('adminUser');
      state.token = null; state.user = null; render();
      return;
    }
    // Bunlardan biri başarısız olsa bile (örn. backend'in en son hali henüz
    // deploy edilmediyse) oturum KAPANMAMALI - sadece o bölüm boş/yüklenemedi
    // görünür. Her biri kendi try/catch'inde, birbirini etkilemesin.
    try{ await loadRevenue(); }catch(err){ console.error('loadRevenue hata:', err); }
    try{ await loadLiveLocations(); startLiveMapPolling(); }catch(err){ console.error('loadLiveLocations hata:', err); }
    try{ await loadApplications(); }catch(err){ console.error('loadApplications hata:', err); }
  }
})();
</script>
</body>
</html>
