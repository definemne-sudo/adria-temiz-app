<style>
  :root{
    --navy:#0F3D2E;
    --navy-2:#14503D;
    --sage:#1D9E73;
    --sage-dark:#14503D;
    --ochre:#1D9E73;
    --bg:#EFF7F2;
    --panel:#FFFFFF;
    --line:#D7E7DE;
    --text:#16241C;
    --muted:#5B7A6C;
    --danger:#B5542A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .brand h1{font-family:'Poppins',sans-serif; font-weight:700;}
  .app{display:flex; min-height:100vh; flex-direction:column;}

  .auth-wrap{
    display:flex; align-items:center; justify-content:center;
    width:100%; min-height:100vh; padding:24px;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,156,130,.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,138,62,.18), transparent 45%),
      var(--navy);
  }
  .auth-card{
    width:100%; max-width:420px; background:var(--panel);
    border-radius:16px; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .brand svg{width:40px; height:40px; display:block; flex-shrink:0;}
  .brand h1{font-size:24px; color:var(--navy); letter-spacing:0.02em;}
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px;}
  .header-row .brand{margin-bottom:0;}
  .header-row .lang-switch{margin-bottom:0;}
  .tagline{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fbfcfb;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .btn{
    width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{background:var(--navy-2);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.ochre{background:var(--ochre);}
  .btn.ochre:hover{background:#178a63;}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn-sm{padding:9px 12px; font-size:13px; border-radius:6px; width:auto;}
  .error-msg{color:var(--danger); font-size:13px; margin:-6px 0 14px;}
  .hint{font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5;}

  .lang-switch{display:flex; gap:4px;}
  .lang-switch button{
    background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 9px;
    font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .lang-switch button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .topbar .lang-switch button{border-color:rgba(255,255,255,.25); color:#C9D6D2;}
  .topbar .lang-switch button.active{background:var(--ochre); border-color:var(--ochre); color:#fff;}

  .topbar{
    background:var(--navy); color:#fff; padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:20; flex-wrap:wrap;
  }
  .topbar .brand h1{color:#fff; font-size:19px;}
  .who{font-size:11px; color:#9FB3AE;}
  .logout{font-size:12px; color:#E7B98C; cursor:pointer; text-decoration:underline; white-space:nowrap;}

  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:45;
    background:var(--navy); justify-content:space-around; align-items:center;
    padding:8px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,.18);
  }
  .nav-item-mobile{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:10px; font-weight:700; color:#9FB3AE; padding:5px 8px; border-radius:10px; cursor:pointer;
  }
  .nav-item-mobile .icon{ display:flex; }
  .nav-item-mobile .icon svg{ width:20px; height:20px; }
  .nav-item-mobile.active{ color:#fff; background:rgba(255,255,255,.12); }
  .nav-item-mobile .count{
    position:absolute; top:-2px; right:2px; background:var(--ochre); color:#fff; font-size:9.5px; font-weight:700;
    border-radius:20px; padding:1px 5px; line-height:1.3;
  }

  .main{flex:1; padding:18px; padding-bottom:96px; max-width:640px; width:100%; margin:0 auto;}
  .empty-state{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;
  }

  .status-pill{ display:inline-block; border-radius:20px; font-weight:700; }
  .job-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; display:flex; flex-direction:column; gap:10px;
  }
  .job-card .top-row{display:flex; align-items:center; gap:12px;}
  .job-icon{
    width:48px; height:48px; border-radius:12px; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--bg);
  }
  .job-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .job-icon span{ font-size:22px; }
  .job-title{font-size:15px; font-weight:700; color:var(--navy);}
  .job-meta{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .job-price{
    font-family:'Fraunces',serif; font-size:19px; color:var(--ochre); margin-left:auto; flex-shrink:0; text-align:right;
  }
  .job-badge{
    display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .job-badge.urgent{background:#F2DADA; color:#A13A3A;}
  .job-badge.scheduled{background:#DCE7F5; color:#2C5C8A;}
  .job-badge.cash{background:#F1E6D3; color:#8A5A19;}
  .job-badge.card{background:#DEEFE0; color:#2E7D46;}
  .job-badge.invoice{background:#E4E0F5; color:#5B3F9E;}
  .job-actions{display:flex; gap:8px;}
  .job-actions .btn{flex:1;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px;
    border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60; white-space:nowrap;
  }

  .online-switch{ position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0; }
  .online-switch input{ opacity:0; width:0; height:0; }
  .online-slider{
    position:absolute; cursor:pointer; inset:0; background:#4A6B5C; border-radius:22px; transition:.15s;
  }
  .online-slider:before{
    content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s;
  }
  .online-switch input:checked + .online-slider{ background:#1D9E73; }
  .online-switch input:checked + .online-slider:before{ transform:translateX(16px); }

  .offline-banner{
    background:#F1E6D3; color:#8A5A19; font-size:12.5px; font-weight:600; text-align:center;
    padding:8px 14px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,48,63,.45); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal{
    background:#fff; border-radius:16px; padding:22px; width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto;
  }
  .mini-map{ width:100%; height:170px; border-radius:10px; overflow:hidden; margin-bottom:14px; background:var(--bg); }
  .detail-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .detail-row span{ color:var(--muted); flex-shrink:0; }
  .detail-row strong{ text-align:right; font-weight:600; }

  .calendar-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px; }
  .cal-day{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:10px 2px; border-radius:10px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
  }
  .cal-day-name{ font-size:9.5px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .cal-day-num{ font-size:15px; font-weight:700; color:var(--navy); }
  .cal-day.has-jobs{ background:var(--navy); border-color:var(--navy); }
  .cal-day.has-jobs .cal-day-name, .cal-day.has-jobs .cal-day-num{ color:#fff; }
  .cal-day.is-today:not(.has-jobs){ border-color:var(--sage); }
  .cal-day.selected{ box-shadow:0 0 0 2px var(--ochre); }

  @media (max-width: 480px){
    .auth-wrap{ padding:16px; }
    .auth-card{ padding:26px 22px; }
    .header-row{ gap:8px; }
    .topbar{ padding:12px 14px; }
    .job-actions{ flex-direction:column; }
  }
</style>
</head>

const SERVICE_NAMES = {
  checkin_checkout: { icon:'icon-service-checkin.png', tr:'Airbnb/Booking Temizliği', en:'Airbnb/Booking Cleaning', me:'Airbnb/Booking čišćenje' },

  office: { icon:'icon-service-office.png', tr:'Ofis / Dükkan Temizliği', en:'Office/Shop Cleaning', me:'Čišćenje poslovnog prostora' },
  common_area: { icon:'icon-service-common-area.png', tr:'Ortak Alan Temizliği', en:'Common Area Cleaning', me:'Čišćenje zajedničkih prostorija' },
};
const COMMON_AREA_SUB_NAMES = {
  staircase: { tr:'Merdiven', en:'Staircase', me:'Stepenište' },
  corridor: { tr:'Kat Koridoru', en:'Floor Corridor', me:'Hodnik' },
  elevator: { tr:'Asansör', en:'Elevator', me:'Lift' },
};

function t(key, vars){
  let str = (TRANSLATIONS[state.lang] && TRANSLATIONS[state.lang][key]) || TRANSLATIONS.tr[key] || key;
  if(vars) Object.keys(vars).forEach(k => { str = str.split('{{'+k+'}}').join(vars[k]); });
  return str;
}
function serviceName(key){
  const s = SERVICE_NAMES[key];
  return s ? (s[state.lang] || s.tr) : key;
}
function serviceIconSrc(key){
  return (SERVICE_NAMES[key] && SERVICE_NAMES[key].icon) || null;
}
function commonAreaSubName(key){
  const s = COMMON_AREA_SUB_NAMES[key];
  return s ? (s[state.lang] || s.tr) : key;
}
function jobServiceLabel(j){
  if(j.service_key === 'common_area'){
    try{
      const selections = JSON.parse(j.service_params || '{}').selections || [];
      return selections.map(s => commonAreaSubName(s.key)).join(', ') || serviceName('common_area');
    }catch(e){ return serviceName('common_area'); }
  }
  return serviceName(j.service_key);
}

/* ================== STATE ================== */
// "Beni oturumda tut" işaretlenirse localStorage (tarayıcı kapansa da kalıcı),
// işaretlenmezse sessionStorage (sekme/tarayıcı kapanınca silinir) kullanılır.
function getStoredToken(){ return localStorage.getItem('staffToken') || sessionStorage.getItem('staffToken') || null; }
function getStoredUser(){
  const raw = localStorage.getItem('staffUser') || sessionStorage.getItem('staffUser');
  return raw ? JSON.parse(raw) : null;
}
function storeSession(token, user, keepSignedIn){
  const store = keepSignedIn ? localStorage : sessionStorage;
  const other = keepSignedIn ? sessionStorage : localStorage;
  store.setItem('staffToken', token);
  store.setItem('staffUser', JSON.stringify(user));
  other.removeItem('staffToken'); other.removeItem('staffUser');
}
function clearSession(){
  localStorage.removeItem('staffToken'); localStorage.removeItem('staffUser');
  sessionStorage.removeItem('staffToken'); sessionStorage.removeItem('staffUser');
}

let state = {
  token: getStoredToken(),
  user: getStoredUser(),
  lang: localStorage.getItem('lang') || 'me',
  page: 'home',
  homeJobs: [],

function render(){
  document.getElementById('html-root').lang = state.lang;
  let html;
  if(!(state.token && state.user)){
    html = renderAuth();
  } else {
    html = renderPanel();
  }

  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;
  const hasSelection = activeEl && typeof activeEl.selectionStart === 'number';
  const selStart = hasSelection ? activeEl.selectionStart : null;
  const selEnd = hasSelection ? activeEl.selectionEnd : null;
  const pageScrollY = window.scrollY;

  document.getElementById('app').innerHTML = html;
  attachHandlers();

  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus({ preventScroll: true });
      if(hasSelection && restored.setSelectionRange){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  window.scrollTo(0, pageScrollY);
}

function langSwitch(){
  return `
  <div class="lang-switch">
    <button class="${state.lang==='me'?'active':''}" data-lang="me">CG</button>
    <button class="${state.lang==='en'?'active':''}" data-lang="en">EN</button>
    <button class="${state.lang==='tr'?'active':''}" data-lang="tr">TR</button>
  </div>`;
}

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers||{}),
    },
  });
  const data = await res.json().catch(()=>({}));
  if(res.status === 401){
    // Token geçerli görünüyor olabilir ama hesap artık yok/oturum geçersiz -
    // kullanıcıyı "çevrimiçiyim ama her şey hata veriyor" gibi kafası karışık
    // bir durumda bırakmak yerine oturumu temizleyip giriş ekranına dönüyoruz.
    clearSession();
    state.token = null; state.user = null; state.authStep = 'login'; state.page = 'home';
    state.authError = t('sessionExpiredError');
    render();
    throw new Error(data.error || t('sessionExpiredError'));
  }
  if(!res.ok) throw new Error(data.error || t('genericError'));
  return data;
}

function renderAuth(){
  let inner = '';

function urgencyBadgeHtml(j){
  if(j.urgency === 'urgent' || j.urgency === 'now'){
    return `<span class="job-badge urgent">${t('urgentBadge')}</span>`;
  }
  return `<span class="job-badge scheduled">${t('scheduledBadge')} · ${new Date(j.checkout_at).toLocaleString(LOCALES[state.lang],{dateStyle:'medium',timeStyle:'short'})}</span>`;
}
function paymentBadgeHtml(j){
  if(j.payment_method === 'card') return `<span class="job-badge card">${t('cardBadge')}</span>`;
  if(j.payment_method === 'invoice') return `<span class="job-badge invoice">${t('invoiceBadge')}</span>`;
  return `<span class="job-badge cash">${t('cashBadge')}</span>`;
}
let staffMiniMapInstance = null;
// İş kartı/teklif ekranındaki küçük haritayı başlatır - müşterinin mülk
// konumunu tek bir sabit pinle gösterir, personel sürükleyip değiştiremez
// (sadece nereye gideceğini görmesi için).
function initStaffMiniMap(containerId, lat, lng){
  const el = document.getElementById(containerId);
  if(!el || typeof L === 'undefined' || !lat || !lng) return;
  if(staffMiniMapInstance){ try{ staffMiniMapInstance.remove(); }catch(e){} staffMiniMapInstance = null; }
  const map = L.map(containerId, { zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false }).setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap' }).addTo(map);
  L.marker([lat, lng]).addTo(map);
  staffMiniMapInstance = map;
  setTimeout(() => map.invalidateSize(), 80);
}

function mapLink(j){
  if(j.property_latitude && j.property_longitude){
    return `https://www.google.com/maps?q=${j.property_latitude},${j.property_longitude}`;
  }
  const addr = encodeURIComponent(`${j.property_address||''} ${j.property_city||''}`.trim());
  return `https://www.google.com/maps/search/?api=1&query=${addr}`;
}

/* ================== TAKVİM PANELİ ================== */
function formatDateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getMonday(d){
  const date = new Date(d);
  const day = date.getDay(); // 0=Pazar, 1=Pazartesi...
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function getWeekDates(mondayKey){
  const monday = new Date(mondayKey + 'T00:00:00');
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
}
function groupJobsByDate(jobs){
  const map = {};
  jobs.forEach(j => {
    const key = formatDateKey(new Date(j.checkout_at));
    if(!map[key]) map[key] = [];
    map[key].push(j);
  });
  return map;
}
function weekRangeLabel(weekDates){
  const opts = { day:'numeric', month:'short' };
  return `${weekDates[0].toLocaleDateString(LOCALES[state.lang], opts)} – ${weekDates[6].toLocaleDateString(LOCALES[state.lang], opts)}`;
}
function findJobById(id){
  return state.homeJobs.find(j => j.id === id)
    || state.myJobs.find(j => j.id === id)
    || null;
}
function estimateJobMinutesClient(job){
  if(job.estimatedMinutes !== undefined) return job.estimatedMinutes;
  if(job.service_key === 'common_area'){
    try{
      const selections = JSON.parse(job.service_params || '{}').selections || [];
      return selections.reduce((sum, sel) => {
        const sub = state.serviceCatalog.commonAreaSubOptions.find(s => s.key === sel.key);
        return sum + (sub ? sub.estimatedMinutes || 0 : 0);
      }, 0);
    }catch(e){ return 0; }
  }
  const service = state.serviceCatalog.services.find(s => s.key === job.service_key);
  return service ? (service.estimatedMinutes || 0) : 0;
}

  const weekDates = getWeekDates(state.calendarWeekStart);
  const jobsByDate = groupJobsByDate(state.myJobs);
  const selectedKey = state.selectedCalendarDate;

  const todayKey = formatDateKey(new Date());

/* ================== HOME PANELİ ================== */
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// NOT: Bu, kuş uçuşu mesafeye dayalı KABA bir tahmin - gerçek trafik/rota
// verisi kullanmaz (o, ücretli bir harita API'si gerektirir). Yol mesafesinin
// kuş uçuşundan ortalama ~1.3x uzun olduğu ve şehir içi ortalama hızın
// ~30km/s olduğu varsayımıyla hesaplanıyor.
function estimateTravelMinutes(fromLat, fromLng, toLat, toLng){
  const km = haversineKm(fromLat, fromLng, toLat, toLng);
  const roadKm = km * 1.3;
  const avgSpeedKmh = 30;
  return Math.max(1, Math.round((roadKm / avgSpeedKmh) * 60));
}
function requestMyLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 8000 }
    );
  });
}

/* ================== PUSH BİLDİRİMLERİ ================== */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// Bildirim izni ister ve push aboneliğini backend'e kaydeder. İzin
// verilmezse (ya da tarayıcı desteklemiyorsa) sessizce geçer - personel
// yine de uygulamayı açtığında Home'dan işlerini görebilir, sadece anlık
// bildirim alamaz.
async function ensurePushSubscription(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') return false;

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const { publicKey } = await fetch(API + '/push/vapid-public-key').then(r => r.json());
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    await api('/push/subscribe', { method:'POST', body: JSON.stringify(sub.toJSON()) });
    return true;
  }catch(e){ return false; }
}

// Çevrimiçi olma akışı: konumu al, push aboneliğini kaydet, sunucuya
// isOnline+konum+şehir bilgisini gönder. Konum alınamazsa çevrimiçi
// olmuyoruz (personelin nereye yakın olduğunu bilemeyiz).
async function goOnlineWithLocation(){
  const loc = await requestMyLocation();
  if(!loc){
    showToast(t('toastLocationNeeded'));
    render();
    return;
  }
  state.myLocation = loc;
  await ensurePushSubscription();
  try{
    await api('/auth/staff-status', { method:'PATCH', body: JSON.stringify({
      isOnline: true, lat: loc.lat, lng: loc.lng, city: state.user.city,
    })});
    state.user.isOnline = true;
    storeSession(state.token, state.user, state.keepSignedIn);
    await loadAll();
  }catch(err){ showToast(err.message); render(); }
}

      <div class="hint" style="margin:0 0 16px;">${t('cityPickerHint')}</div>
      <div class="field">
        <label>${t('cityLabel')}</label>
        <select id="city-select">
          ${MONTENEGRO_CITIES.map(c => `<option value="${c}" ${c===(state.user.city||'')?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <button class="btn ochre" id="confirm-city">${t('confirmCityBtn')}</button>
    </div>
  </div>`;
}

function renderMine(){
  if(state.myJobs.length === 0) return `<div class="empty-state">${t('emptyMyJobs')}</div>`;
  return state.myJobs.map(j => renderJobCard(j, 'mine')).join('');
}

/* ================== VERİ YÜKLEME ================== */
async function loadAll(){
  const [mine, home, pending, finance] = await Promise.all([ api('/jobs/mine'), api('/jobs/home-summary'), api('/jobs/pending'), api('/jobs/finance-summary') ]);
  state.myJobs = mine;
  state.homeJobs = home.todaysJobs;
  state.earningsToday = home.earningsToday;
  state.pendingJobs = pending;
  state.financeData = finance;
  if(!state.serviceCatalog.services.length){
    try{
      const catalog = await fetch(API + '/services').then(r => r.json());
      state.serviceCatalog = { services: catalog.services || [], commonAreaSubOptions: catalog.commonAreaSubOptions || [] };
    }catch(e){ /* sessizce geç, sadece süre gösterimi eksik kalır */ }
  }
  render();
}

/* ================== EVENT HANDLERS ================== */
function attachHandlers(){
  if(state.offerJob && state.offerJob.canRespond !== false && state.offerJob.property_latitude && state.offerJob.property_longitude){
    initStaffMiniMap('offer-map', state.offerJob.property_latitude, state.offerJob.property_longitude);
  }
  if(state.detailJob && state.detailJob.property_latitude && state.detailJob.property_longitude){
    initStaffMiniMap('detail-map', state.detailJob.property_latitude, state.detailJob.property_longitude);
  }

  document.querySelectorAll('[data-lang]').forEach(el => el.onclick = () => {
    state.lang = el.dataset.lang;
    localStorage.setItem('lang', state.lang);
    render();
  });

  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(loginForm));
    const keepSignedIn = document.getElementById('keep-signed-in').checked;
    try{
      const data = await api('/auth/staff-login', { method:'POST', body: JSON.stringify({ username: fd.username, password: fd.password }) });
      state.token = data.token; state.user = data.user;
      state.keepSignedIn = keepSignedIn;
      storeSession(data.token, data.user, keepSignedIn);
      state.authError = '';
      await loadAll();
    }catch(err){ state.authError = err.message; render(); }
  };

  const gotoFirstActivation = document.getElementById('goto-first-activation');
  if(gotoFirstActivation) gotoFirstActivation.onclick = () => { state.authStep = 'activate'; state.authError = ''; render(); };

  const backToLogin = document.getElementById('back-to-login');
  if(backToLogin) backToLogin.onclick = () => { state.authStep = 'login'; state.authError = ''; render(); };

  const activationCodeInput = document.getElementById('activation-code-input');
  if(activationCodeInput) activationCodeInput.oninput = () => { state.activationCode = activationCodeInput.value.toUpperCase(); };
  const activationUsernameInput = document.getElementById('activation-username-input');
  if(activationUsernameInput) activationUsernameInput.oninput = () => { state.activationUsername = activationUsernameInput.value; };
  const activationPasswordInput = document.getElementById('activation-password-input');
  if(activationPasswordInput) activationPasswordInput.oninput = () => { state.activationPassword = activationPasswordInput.value; };
  const activationPasswordConfirmInput = document.getElementById('activation-password-confirm-input');
  if(activationPasswordConfirmInput) activationPasswordConfirmInput.oninput = () => { state.activationPasswordConfirm = activationPasswordConfirmInput.value; };
  const activationAgeCheckbox = document.getElementById('activation-age-checkbox');
  if(activationAgeCheckbox) activationAgeCheckbox.onchange = () => { state.activationConfirmedAge = activationAgeCheckbox.checked; render(); };
  const activationTermsCheckbox = document.getElementById('activation-terms-checkbox');
  if(activationTermsCheckbox) activationTermsCheckbox.onchange = () => { state.activationAcceptedTerms = activationTermsCheckbox.checked; render(); };

  const activateForm = document.getElementById('activate-form');
  if(activateForm) activateForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(activateForm));
    if(!state.activationConfirmedAge){
      state.authError = t('pleaseConfirmAge'); render(); return;
    }
    if(!state.activationAcceptedTerms){
      state.authError = t('pleaseAcceptTerms'); render(); return;
    }
    if(fd.password !== fd.passwordConfirm){
      state.authError = t('passwordMismatchError'); render(); return;
    }
    try{
      const data = await api('/auth/staff-activate', { method:'POST', body: JSON.stringify({
        code: fd.code, username: fd.username, password: fd.password,
      })});
      state.token = data.token; state.user = data.user;
      storeSession(data.token, data.user, state.keepSignedIn);
      state.authStep = 'login';
      state.activationCode = ''; state.activationUsername = ''; state.activationPassword = ''; state.activationPasswordConfirm = '';
      state.activationAcceptedTerms = false; state.activationConfirmedAge = false;
      state.authError = '';
      await loadAll();
    }catch(err){ state.authError = err.message; render(); }
  };

  document.querySelectorAll('[data-page]').forEach(el => el.onclick = async () => {
    state.page = el.dataset.page; render();
    if(state.page === 'performance') await loadPerformance();
    if(state.page === 'ratings') await loadRatings();
  });

  document.querySelectorAll('[data-perf-period]').forEach(el => el.onclick = async () => {
    state.perfPeriod = el.dataset.perfPeriod; state.perfOffset = 0;
    await loadPerformance();
  });
  const perfPrev = document.getElementById('perf-prev');
  if(perfPrev) perfPrev.onclick = async () => { state.perfOffset -= 1; await loadPerformance(); };
  const perfNext = document.getElementById('perf-next');
  if(perfNext) perfNext.onclick = async () => { state.perfOffset += 1; await loadPerformance(); };

  document.querySelectorAll('[data-ratings-period]').forEach(el => el.onclick = async () => {
    state.ratingsPeriod = el.dataset.ratingsPeriod; state.ratingsOffset = 0;
    await loadRatings();
  });
  const ratingsPrev = document.getElementById('ratings-prev');
  if(ratingsPrev) ratingsPrev.onclick = async () => { state.ratingsOffset -= 1; await loadRatings(); };
  const ratingsNext = document.getElementById('ratings-next');
  if(ratingsNext) ratingsNext.onclick = async () => { state.ratingsOffset += 1; await loadRatings(); };

  const logout = document.getElementById('logout');
  if(logout) logout.onclick = () => {
    clearSession();
    state.token = null; state.user = null; state.authStep = 'login'; state.page = 'home'; render();
  };

  const onlineToggle = document.getElementById('online-toggle');
  if(onlineToggle) onlineToggle.onchange = async () => {
    const wantsOnline = onlineToggle.checked;
    if(!wantsOnline){
      try{
        await api('/auth/staff-status', { method:'PATCH', body: JSON.stringify({ isOnline:false }) });
        state.user.isOnline = false;
        storeSession(state.token, state.user, state.keepSignedIn);
        await loadAll();
      }catch(err){ showToast(err.message); render(); }
      return;
    }
    // Çevrimiçi olmak icin: sehir bilinmiyorsa once sec, sonra konum al,
    // push aboneligini kaydet, en son sunucuya bildir.
    if(!state.user.city){
      onlineToggle.checked = false; // secim onaylanana kadar anahtari geri al
      state.showCityPicker = true;
      render();
      return;
    }
    await goOnlineWithLocation();
  };

  const confirmCity = document.getElementById('confirm-city');
  if(confirmCity) confirmCity.onclick = async () => {
    const city = document.getElementById('city-select').value;
    state.user.city = city;
    storeSession(state.token, state.user, state.keepSignedIn);
    state.showCityPicker = false;
    await goOnlineWithLocation();
  };
  const cityBackdrop = document.getElementById('city-backdrop');
  if(cityBackdrop) cityBackdrop.onclick = (e) => { if(e.target===cityBackdrop){ state.showCityPicker=false; render(); } };

  const checkOffersBtn = document.getElementById('check-offers-btn');
  if(checkOffersBtn) checkOffersBtn.onclick = async () => {
    checkOffersBtn.disabled = true;
    try{
      const data = await api('/jobs/my-pending-offer');
      if(data.jobId) await loadOffer(data.jobId);
      else showToast(t('toastNoOffers'));
    }catch(err){ showToast(err.message); }
    checkOffersBtn.disabled = false;
  };

  document.querySelectorAll('[data-open-offer]').forEach(el => el.onclick = async () => {
    if(!state.user.isOnline){ showToast(t('toastMustBeOnline')); return; }
    if(!state.myLocation){ state.myLocation = await requestMyLocation(); }
    await loadOffer(el.dataset.openOffer);
  });

  const refreshPendingBtn = document.getElementById('refresh-pending-btn');
  if(refreshPendingBtn) refreshPendingBtn.onclick = async () => { await loadAll(); };

  const acceptOffer = document.getElementById('accept-offer');
  if(acceptOffer) acceptOffer.onclick = async () => {
    try{
      await api(`/jobs/${state.offerJob.id}/accept`, { method:'POST' });
      showToast(t('toastOfferAccepted'));
      state.offerJob = null; state.offerError = '';
      await loadAll();
    }catch(err){ state.offerError = err.message; render(); }
  };

  const rejectOffer = document.getElementById('reject-offer');
  if(rejectOffer) rejectOffer.onclick = async () => {
    try{
      await api(`/jobs/${state.offerJob.id}/reject`, { method:'POST' });
      showToast(t('toastOfferRejected'));
    }catch(err){ /* onemli degil, yine de kapat */ }
    state.offerJob = null; state.offerError = '';
    render();
  };

  const closeOffer = document.getElementById('close-offer');
  if(closeOffer) closeOffer.onclick = () => { state.offerJob = null; state.offerError = ''; render(); };

  const offerBackdrop = document.getElementById('offer-backdrop');
  if(offerBackdrop) offerBackdrop.onclick = (e) => { if(e.target===offerBackdrop){ state.offerJob = null; render(); } };

  document.querySelectorAll('[data-cal-date]').forEach(el => el.onclick = () => {
    state.selectedCalendarDate = el.dataset.calDate; render();
  });

  const calPrevWeek = document.getElementById('cal-prev-week');
  if(calPrevWeek) calPrevWeek.onclick = () => {
    const monday = new Date(state.calendarWeekStart + 'T00:00:00');
    monday.setDate(monday.getDate() - 7);
    state.calendarWeekStart = formatDateKey(monday);
    render();
  };
  const calNextWeek = document.getElementById('cal-next-week');
  if(calNextWeek) calNextWeek.onclick = () => {
    const monday = new Date(state.calendarWeekStart + 'T00:00:00');
    monday.setDate(monday.getDate() + 7);
    state.calendarWeekStart = formatDateKey(monday);
    render();
  };

  document.querySelectorAll('[data-open-detail]').forEach(el => el.onclick = async () => {
    const job = findJobById(el.dataset.openDetail);
    if(!job) return;
    if(!state.myLocation){
      state.myLocation = await requestMyLocation();
    }
    state.detailJob = job;
    render();
  });

  const closeDetail = document.getElementById('close-detail');
  if(closeDetail) closeDetail.onclick = () => { state.detailJob = null; render(); };
  const detailBackdrop = document.getElementById('detail-backdrop');
  if(detailBackdrop) detailBackdrop.onclick = (e) => { if(e.target === detailBackdrop){ state.detailJob = null; render(); } };

  const openSupport = document.getElementById('open-support');
  if(openSupport) openSupport.onclick = () => { state.supportView = 'menu'; state.supportError = ''; render(); };

  const supportMessage = document.getElementById('support-message');
  if(supportMessage) supportMessage.onclick = () => { state.supportView = 'message'; render(); };

  const supportReport = document.getElementById('support-report');
  if(supportReport) supportReport.onclick = () => { state.supportView = 'report'; render(); };

  const closeSupport = document.getElementById('close-support');
  if(closeSupport) closeSupport.onclick = () => { state.supportView = null; state.supportError = ''; render(); };
  const supportBackdrop = document.getElementById('support-backdrop');
  if(supportBackdrop) supportBackdrop.onclick = (e) => { if(e.target === supportBackdrop){ state.supportView = null; render(); } };

  const sendSupport = document.getElementById('send-support');
  if(sendSupport) sendSupport.onclick = async () => {
    const textEl = document.getElementById('support-text');
    const text = textEl ? textEl.value.trim() : '';
    if(!text){ state.supportError = t('supportEmptyError'); render(); return; }
    const j = state.detailJob || state.offerJob;
    const isReport = state.supportView === 'report';
    const jobRef = j ? ` (${t('jobDetailTitle')}: ${jobServiceLabel(j)} - ${j.property_address || j.property_name || ''})` : '';
    const finalMessage = (isReport ? `[${t('supportReportBtn')}]${jobRef}\n` : '') + text;
    try{
      await api('/chat/messages', { method:'POST', body: JSON.stringify({ message: finalMessage }) });
      state.supportView = null; state.supportError = '';
      showToast(t('toastSupportSent'));
      render();
    }catch(err){ state.supportError = err.message; render(); }
  };

  document.querySelectorAll('[data-mark-received]').forEach(el => el.onclick = async () => {
    try{
      await api('/jobs/finance/mark-received', { method:'POST', body: JSON.stringify({
        periodStart: el.dataset.markReceived,
        periodEnd: el.dataset.markReceivedEnd,
        amount: el.dataset.markReceivedAmount,
      })});
      showToast(t('toastPaymentMarkedReceived'));
      await loadAll();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-head-out]').forEach(el => el.onclick = async () => {
    try{
      await api(`/jobs/${el.dataset.headOut}/head-out`, { method:'POST' });
      showToast(t('toastHeadedOut'));
    }catch(err){ showToast(err.message); }
    window.open(el.dataset.mapLink, '_blank', 'noopener');
  });

  document.querySelectorAll('[data-start-job]').forEach(el => el.onclick = async () => {
    try{
      await api(`/jobs/${el.dataset.startJob}/status`, { method:'PATCH', body: JSON.stringify({ status:'in_progress' }) });
      showToast(t('toastJobStarted'));
      await loadAll();
      // Modalı kapatmak yerine, güncel (artık 'in_progress') haliyle açık
      // tutuyoruz - böylece personel "İşi Tamamla" ve destek butonunu
      // görmek için kartı tekrar açmak zorunda kalmıyor.
      const updated = findJobById(el.dataset.startJob);
      state.detailJob = updated || null;
      render();
    }catch(err){ showToast(err.message); }
  });

  document.querySelectorAll('[data-complete]').forEach(el => el.onclick = async () => {
    try{
      await api(`/jobs/${el.dataset.complete}/status`, { method:'PATCH', body: JSON.stringify({ status:'done' }) });
      showToast(t('toastCompleted'));
      state.detailJob = null;
      await loadAll();
    }catch(err){ showToast(err.message); }
  });
}

/* ================== INIT ================== */
// Bildirime tıklandığında (uygulama zaten açıksa) service worker'dan gelen
// mesajı dinleyip ilgili iş teklifini açar.
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (event) => {
    if(event.data && event.data.type === 'OPEN_OFFER' && event.data.jobId && state.token){
      loadOffer(event.data.jobId);
    }
  });
}

(async function init(){
  if(state.token && !state.user){
    clearSession(); state.token = null;
  }
  render();
  if(state.token){
    try{
      await loadAll();
      // Bildirime tıklanıp uygulama kapalıyken açıldıysa (?offerJobId=...)
      // ilgili teklifi göster.
      const params = new URLSearchParams(location.search);
      const offerJobId = params.get('offerJobId');
      if(offerJobId) await loadOffer(offerJobId);
    } catch(err){
      clearSession();
      state.token = null; state.user = null; render();
    }
  }
})();
</script>
</body>
</html>
