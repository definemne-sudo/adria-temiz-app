<!DOCTYPE html>
<html lang="me" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MICISTO</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F3D2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy:#0F3D2E;
    --navy-2:#14503D;
    --sage:#1D9E73;
    --sage-dark:#14503D;
    --ochre:#1D9E73;
    --bg:#EFF7F2;
    --panel:#FFFFFF;
    --line:#D7E7DE;
    --text:#16241C;
    --muted:#5B7A6C;
    --danger:#B5542A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .brand h1, .brand-word{font-family:'Poppins',sans-serif; font-weight:700;}
  .app{display:flex; min-height:100vh;}

  .auth-wrap{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; min-height:100vh; padding:24px 0; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(29,158,115,.16), transparent 50%),
      radial-gradient(circle at 88% 78%, rgba(201,138,62,.13), transparent 45%),
      var(--navy);
  }
  .auth-bg-motif{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .auth-left{
    position:relative; z-index:1; width:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:0 24px; flex:none;
  }
  .auth-left .brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:10px; }
  .auth-left .brand svg{ width:76px; height:76px; display:block; }
  .auth-left .brand h1{ font-size:32px; color:#fff; letter-spacing:0.04em; }
  .auth-left .auth-headline{
    font-family:'Fraunces',serif; font-weight:500; font-style:italic; font-size:16.5px;
    color:rgba(255,255,255,.88); text-align:center; max-width:300px; line-height:1.4;
  }
  .auth-left .auth-accent-rule{ background:linear-gradient(90deg, var(--sage), var(--ochre)); width:48px; height:3px; border-radius:3px; margin:14px auto 0; }
  .auth-right{ position:relative; z-index:1; width:100%; flex:none; display:flex; justify-content:center; padding:8px 20px 0; }
  .auth-panel-stack{ width:100%; max-width:420px; }
  .auth-lang-above{ display:flex; justify-content:center; margin-bottom:14px; }
  .auth-lang-above .lang-switch{ margin-bottom:0; justify-content:center; }
  .auth-card{
    position:relative; width:100%; background:var(--panel);
    border-radius:18px; padding:32px 28px 30px; box-shadow:0 24px 70px rgba(5,20,15,.4);
  }

  /* Masaüstünde: sol yarıda kocaman marka/slogan (sabit, tam yükseklik),
     form + dil seçici sağ yarıda ortalanır. */
  @media (max-width:959px){
    .auth-wrap.hide-hero-mobile{ justify-content:center; }
    .auth-wrap.hide-hero-mobile .auth-left{ display:none; }
  }

  @media (min-width:960px){
    .auth-wrap{ flex-direction:row; align-items:stretch; padding:0; }
    .auth-left{
      position:absolute; inset:0; width:52%; flex:none; padding:40px; justify-content:center;
    }
    .auth-left .brand svg{ width:110px; height:110px; }
    .auth-left .brand h1{ font-size:44px; }
    .auth-left .auth-headline{ font-size:24px; max-width:380px; }
    .auth-left .auth-accent-rule{ width:64px; height:4px; margin-top:22px; }
    .auth-right{
      width:48%; margin-left:52%; align-items:center; padding:40px; min-height:100vh;
      background:var(--bg);
    }
    .auth-card{ box-shadow:0 8px 30px rgba(15,61,46,.08); border:1px solid var(--line); padding:38px 34px 32px; }
    .auth-lang-above .lang-switch button{background:var(--panel); border-color:var(--line); color:var(--muted);}
    .auth-lang-above .lang-switch button.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .brand svg{width:40px; height:40px; display:block; flex-shrink:0;}
  .brand h1{font-size:27px; color:var(--navy); letter-spacing:0.03em;}
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px;}
  .header-row .brand{margin-bottom:0;}
  .header-row .lang-switch{margin-bottom:0;}
  .tagline{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fbfcfb;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .mini-map{width:100%; height:180px; border-radius:8px; border:1px solid var(--line); margin-bottom:6px;}
  .map-hint{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .account-type-choice{display:flex; gap:10px; margin-bottom:14px;}
  .option-row{display:flex; gap:10px; margin-bottom:14px;}
  .choice{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px; cursor:pointer;
    text-align:center; font-size:13px; font-weight:600; color:var(--muted);
  }
  .choice.selected{border-color:var(--sage-dark); background:rgba(124,156,130,.12); color:var(--navy);}
  .btn.light-sage{ background:rgba(29,158,115,.14); color:var(--sage-dark); }
  .btn.light-sage:hover{ background:rgba(29,158,115,.24); }
  .rating-icon-btn{
    flex:1; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); border-radius:12px; padding:18px; cursor:pointer;
    color:var(--muted); background:#fff; transition:background .15s, border-color .15s, color .15s;
  }
  .rating-icon-btn svg{ display:block; }
  .rating-icon-btn.selected-like{ background:var(--ochre); border-color:var(--ochre); color:#fff; }
  .rating-icon-btn.selected-dislike{ background:var(--ochre); border-color:var(--ochre); color:#E24C4C; }
  .btn{
    width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.ochre{background:var(--ochre);}
  .btn.ochre:hover{background:#b5792f;}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .error-msg{color:var(--danger); font-size:13px; margin:-6px 0 14px;}
  .hint{font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5;}

  .lang-switch{display:flex; gap:4px; justify-content:flex-end; margin-bottom:14px;}
  .lang-switch button{
    background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 9px;
    font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .lang-switch button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .sidebar .lang-switch button{border-color:rgba(255,255,255,.25); color:#C9D6D2;}
  .sidebar .lang-switch button.active{background:var(--ochre); border-color:var(--ochre); color:#fff;}
  .auth-lang-above .lang-switch button{background:rgba(255,255,255,.85); border-color:rgba(255,255,255,.5); color:var(--muted);}
  .auth-lang-above .lang-switch button.active{background:var(--navy); border-color:var(--navy); color:#fff;}

  .sidebar{
    width:230px; background:var(--navy); color:#EAF0EE; padding:22px 18px; flex-shrink:0;
    display:flex; flex-direction:column;
  }
  .sidebar .brand{color:#fff; margin-bottom:2px;}
  .sidebar .brand h1{color:#fff; font-size:24px;}
  .account-badge{
    margin-top:6px; margin-bottom:20px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--sage); font-weight:700;
  }
  .nav-item{
    padding:10px 12px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
    color:#C9D6D2; margin-bottom:4px;
  }
  .nav-item.active{background:rgba(255,255,255,.1); color:#fff;}
  .sidebar .spacer{flex:1;}
  .who{font-size:12px; color:#9FB3AE; line-height:1.5; margin-bottom:10px;}
  .logout{font-size:12px; color:#E7B98C; cursor:pointer; text-decoration:underline;}

  .main{flex:1; padding:32px 40px; max-width:1100px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;}
  .page-head h2{font-size:26px; color:var(--navy);}
  .page-head p{color:var(--muted); font-size:13px; margin-top:4px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-bottom:28px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column;}
  .card .row-actions{margin-top:auto; padding-top:10px;}
  .card h3{font-size:15px; color:var(--navy); margin-bottom:4px;}
  .card .meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .card .price{font-family:'Fraunces',serif; font-size:20px; color:var(--ochre); margin-bottom:12px;}
  .service-icon{
    width:92px; height:92px; border-radius:22px; overflow:hidden; margin-bottom:14px;
    box-shadow:0 4px 14px rgba(15,61,46,.18);
    display:flex; align-items:center; justify-content:center; background:var(--bg);
  }
  .service-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .property-avatar{
    width:92px; height:92px; border-radius:22px; overflow:hidden; margin-bottom:14px;
    box-shadow:0 4px 14px rgba(15,61,46,.18);
  }
  .property-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-actions{display:flex; gap:8px;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:6px;}
  .room-stepper-btn{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel);
    color:var(--navy); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; line-height:1; font-family:inherit;
  }
  .room-stepper-btn:hover{ border-color:var(--sage); }
  .room-stepper-btn:disabled{ opacity:.35; cursor:not-allowed; }

  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 14px; background:#F5F8F6; border-bottom:1px solid var(--line);}
  td{padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  .badge.pending{background:#F1E6D3; color:#8A5A19;}
  .badge.assigned{background:#DCE7F5; color:#2C5C8A;}
  .badge.in_progress{background:#E4E0F5; color:#5B3F9E;}
  .badge.done{background:#DEEFE0; color:#2E7D46;}
  .badge.confirmed{background:#CFEAD4; color:#1F6B34;}
  .badge.cancelled{background:#F2DADA; color:#A13A3A;}
  .pay-badge{font-size:11px; font-weight:700;}
  .pay-badge.unpaid{color:var(--muted);}
  .pay-badge.held{color:var(--ochre);}
  .pay-badge.released{color:var(--sage-dark);}
  .empty-state{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:40px; text-align:center; color:var(--muted);
  }
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
  .toolbar .btn{width:auto; white-space:nowrap;}
  .toolbar .btn{width:auto; padding:9px 16px;}
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,48,63,.45); display:flex; align-items:center; justify-content:center; z-index:50;
    backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  }
  .modal{background:#fff; border-radius:14px; padding:26px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-bottom:16px; color:var(--navy);}
  .modal .actions{display:flex; gap:10px; margin-top:18px;}
  .modal .actions .btn{flex:1; width:auto;}
  .booking-panel-mobile-backdrop{ display:none; }
  .booking-panel-overlay-close{ display:none; }
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:0 20px;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:12px 18px;
    border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60;
  }

  /* --- Acil durum chat widget'ı --- */
  .chat-fab{
    position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%;
    background:var(--ochre); color:#fff; border:none; box-shadow:0 8px 20px rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:55; font-size:24px;
  }
  .chat-panel{
    position:fixed; bottom:92px; right:24px; width:320px; max-width:calc(100vw - 32px);
    height:420px; max-height:60vh; background:#fff; border-radius:16px;
    box-shadow:0 16px 48px rgba(0,0,0,.3); display:flex; flex-direction:column; overflow:hidden; z-index:55;
  }
  .chat-panel-header{ background:var(--navy); color:#fff; padding:14px 16px; flex-shrink:0; }
  .chat-panel-header svg{ width:22px; height:22px; display:block; }
  .chat-panel-body{ flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .chat-bubble{ max-width:82%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.4; }
  .chat-bubble.user{ align-self:flex-end; background:var(--ochre); color:#fff; border-bottom-right-radius:2px; }
  .chat-bubble.admin{ align-self:flex-start; background:var(--bg); color:var(--text); border-bottom-left-radius:2px; }
  .chat-panel-footer{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); flex-shrink:0; }
  .chat-panel-footer textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13px; max-height:60px;
  }

  /* --- Mobil düzen --- */
  .bottom-nav{ display:none; }
  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @media (max-width: 760px){
    .two-col{ grid-template-columns:1fr; }
    .app{ flex-direction:column; }

    .sidebar{
      width:100%; flex-direction:row; align-items:center; justify-content:space-between;
      padding:12px 16px; position:sticky; top:0; z-index:45; gap:10px;
    }
    .sidebar-top{ display:flex; align-items:center; gap:10px; }
    .sidebar .brand{ margin-bottom:0; }
    .sidebar .brand h1{ font-size:19px; }
    .sidebar .brand svg{ width:30px; height:30px; }
    .sidebar .header-row{ margin-bottom:0; gap:10px; }
    .sidebar .lang-switch{ gap:3px; }
    .sidebar .lang-switch button{ padding:3px 6px; font-size:10px; }
    .sidebar .account-badge{ display:none; }
    .sidebar .nav-item{ display:none; }
    .sidebar .spacer{ display:none; }
    .sidebar .who{ display:none; }
    .sidebar .lang-switch{ margin-bottom:0; }
    .sidebar .logout{ font-size:11px; white-space:nowrap; }

    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0;
      background:var(--navy); justify-content:space-around; align-items:center;
      padding:8px 6px calc(6px + env(safe-area-inset-bottom)); z-index:45;
      box-shadow:0 -6px 20px rgba(0,0,0,.18);
    }
    .nav-item-mobile{
      display:flex; flex-direction:column; align-items:center; gap:2px;
      font-size:10.5px; font-weight:700; color:#9FB3AE; padding:5px 16px; border-radius:10px; cursor:pointer;
    }
    .nav-item-mobile .icon{ display:flex; }
    .nav-item-mobile .icon svg{ width:19px; height:19px; }
    .nav-item-mobile.active{ color:#fff; background:rgba(255,255,255,.12); }

    .main{ padding:16px; padding-bottom:88px; max-width:100%; }
    .page-head{ flex-direction:column; align-items:flex-start; gap:10px; }
    .grid{ grid-template-columns:1fr; gap:12px; }

    .modal-backdrop{ align-items:flex-end; padding:0; }
    .modal{
      max-width:100%; width:100%; border-radius:16px 16px 0 0;
      max-height:88vh; overflow-y:auto; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    }

    /* Sipariş oluşturma adımları (Sipariş Oluştur/Ekstra/Checklist/Ödeme) -
       mobilde bir modal gibi ön plana çıkıp arkayı buğulu bırakıyor, sabit
       tam ekran, kendi içinde kayıyor - arkadaki hizmet listesi kaymıyor. */
    .booking-panel-mobile-backdrop{
      display:block; position:fixed; inset:0; z-index:51; background:rgba(18,48,63,.4);
      backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    }
    .booking-panel-mobile-overlay{
      position:fixed; inset:0; z-index:52; background:var(--panel);
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    }
    .booking-panel-overlay-close{
      display:flex; align-items:center; justify-content:center; margin-left:auto;
      width:32px; height:32px; border-radius:50%; background:var(--bg); border:1px solid var(--line);
      color:var(--navy); font-size:16px; cursor:pointer;
    }

    .row-actions{ flex-wrap:wrap; }
    .row-actions .btn-sm{ flex:1; min-width:120px; }

    .chat-fab{ bottom:calc(80px + env(safe-area-inset-bottom)); right:16px; width:50px; height:50px; font-size:21px; }
    .chat-panel{ bottom:calc(140px + env(safe-area-inset-bottom)); right:16px; width:calc(100vw - 32px); }
  }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000/api'
  : 'https://adria-temiz-app-production.up.railway.app/api';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* ================== CEVIRILER ================== */
const LOCALES = { tr:'tr-TR', en:'en-GB', me:'sr-Latn-ME' };

const BRAND_MARK = `<svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display:block;">
  <circle cx="100" cy="100" r="96" fill="#1D9E73"/>
  <path d="M58,122 C55,78 92,50 145,52 C147,104 118,138 76,138 C68,138 61,132 58,122 Z" fill="#F6FBF8"/>
  <path d="M74,104 L93,123 L131,78" stroke="#0F3D2E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>`;

// Auth ekranı arka planındaki imza motif: Karadağ kıyı şeridini anımsatan
// yalın bir bina silüeti (alt) + "temizlik/parıltı" temasını temsil eden
// birkaç ışıltı (üst) - jenerik gradient yerine markaya ve konuya özgü,
// çok düşük opasiteli bir doku.
const AUTH_BG_MOTIF = `<svg class="auth-bg-motif" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <g fill="#ffffff" opacity="0.05">
    <rect x="-10" y="470" width="90" height="130" rx="2"/>
    <rect x="70" y="430" width="70" height="170" rx="2"/>
    <polygon points="140,430 175,395 210,430 210,470 140,470"/>
    <rect x="150" y="470" width="60" height="130" rx="2"/>
    <rect x="210" y="450" width="55" height="150" rx="2"/>
    <rect x="265" y="405" width="80" height="195" rx="2"/>
    <polygon points="345,405 385,365 425,405 425,440 345,440"/>
    <rect x="355" y="440" width="70" height="160" rx="2"/>
    <rect x="425" y="460" width="60" height="140" rx="2"/>
    <rect x="485" y="420" width="75" height="180" rx="2"/>
    <polygon points="560,420 600,380 640,420 640,455 560,455"/>
    <rect x="570" y="455" width="70" height="145" rx="2"/>
    <rect x="640" y="440" width="65" height="160" rx="2"/>
    <rect x="705" y="470" width="105" height="130" rx="2"/>
  </g>

function render(){
  document.getElementById('html-root').lang = state.lang;
  let html;
  if(!(state.token && state.user)){
    html = renderAuth();
  } else if(state.ratingJob){
    html = renderRatingScreen();
  } else {
    html = renderPanel();
  }

  // innerHTML degisimi tum DOM'u sifirliyor - bu da kullanici bir alana
  // yazarken sayfanin odagini ve kaydirma konumunu kaybetmesine, ekranin
  // yukari zipmasina neden oluyor. Yeniden cizmeden once neye odaklanildigini
  // ve nerede kaydirildigini kaydedip, sonra geri yukluyoruz.
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;
  const hasSelection = activeEl && typeof activeEl.selectionStart === 'number';
  const selStart = hasSelection ? activeEl.selectionStart : null;
  const selEnd = hasSelection ? activeEl.selectionEnd : null;
  const pageScrollY = window.scrollY;
  const mainScrollEl = document.querySelector('.main');
  const mainScrollTop = mainScrollEl ? mainScrollEl.scrollTop : null;
  const chatBodyEl = document.getElementById('chat-panel-body');
  const chatScrollTop = chatBodyEl ? chatBodyEl.scrollTop : null;
  const modalEl = document.querySelector('.modal');
  const modalScrollTop = modalEl ? modalEl.scrollTop : null;
  const bookingOverlayEl = document.querySelector('.booking-panel-mobile-overlay');
  const bookingOverlayScrollTop = bookingOverlayEl ? bookingOverlayEl.scrollTop : null;

  document.getElementById('app').innerHTML = html;
  attachHandlers();

  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus({ preventScroll: true });
      if(hasSelection && restored.setSelectionRange){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  window.scrollTo(0, pageScrollY);
  const newMainScrollEl = document.querySelector('.main');
  if(newMainScrollEl && mainScrollTop !== null) newMainScrollEl.scrollTop = mainScrollTop;
  const newChatBodyEl = document.getElementById('chat-panel-body');
  if(newChatBodyEl && chatScrollTop !== null) newChatBodyEl.scrollTop = chatScrollTop;
  const newModalEl = document.querySelector('.modal');
  if(newModalEl && modalScrollTop !== null) newModalEl.scrollTop = modalScrollTop;
  const newBookingOverlayEl = document.querySelector('.booking-panel-mobile-overlay');
  if(newBookingOverlayEl && bookingOverlayScrollTop !== null) newBookingOverlayEl.scrollTop = bookingOverlayScrollTop;

  // Bir modal ya da (mobilde) sipariş oluşturma paneli tam ekran overlay
  // olarak açıkken, arkadaki sayfanın kayması "focus" hissini bozuyor -
  // bu yüzden arka plan scroll'unu kilitliyoruz. Masaüstünde booking paneli
  // hâlâ sayfanın normal akışında (inline) göründüğü için orada kilitlemiyoruz.
  const isNarrowViewport = window.innerWidth <= 760;
  const overlayActive = !!state.modal || (isNarrowViewport && !!state.bookingService);
  document.body.style.overflow = overlayActive ? 'hidden' : '';
}

let leafletMapInstance = null;
function initLeafletPickerMap(containerId, onPick, initialLat, initialLng){
  const el = document.getElementById(containerId);
  if(!el || typeof L === 'undefined') return;
  if(leafletMapInstance){ try{ leafletMapInstance.remove(); }catch(e){} leafletMapInstance = null; }
  const startLat = initialLat || 42.43;
  const startLng = initialLng || 18.9;
  const map = L.map(containerId).setView([startLat, startLng], initialLat ? 14 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);
  let marker = initialLat ? L.marker([initialLat, initialLng]).addTo(map) : null;
  map.on('click', (e) => {
    if(marker) marker.remove();
    marker = L.marker(e.latlng).addTo(map);
    onPick(e.latlng.lat, e.latlng.lng);
  });
  leafletMapInstance = map;
  setTimeout(() => map.invalidateSize(), 100);
}

async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers||{}),
    },
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(translateError(data.error || t('genericError')));
  return data;
}

function calcPriceClient(service, { sizeSqm } = {}){
  const price = service.base + (Number(sizeSqm)||0) * service.rate;
  return Math.max(service.min, Math.round(price/5)*5);
}

function bookingAddonsTotal(){
  let total = 0;
  Object.entries(state.bookingAddons).forEach(([key, val]) => {
    if(val && val.checked){
      const addon = state.addons.find(a => a.key === key);
      if(addon) total += addon.rate * Math.max(1, Number(val.quantity)||1);
    }
  });
  return total;
}

function calcCommonAreaSubPriceClient(sub, params = {}){
  let price = sub.base;
  if(sub.paramType === 'floors') price += (Number(params.floorCount)||0) * sub.ratePerFloor;
  else if(sub.paramType === 'corridor'){
    const floors = Number(params.floorCount)||0;
    const sqmPerFloor = Number(params.sqmPerFloor)||0;
    price += floors * sub.ratePerFloor;
    price += (floors * sqmPerFloor) * sub.ratePerSqm;
  } else if(sub.paramType === 'elevator') price += (Number(params.elevatorCapacity)||0) * sub.ratePerCapacity;
  return Math.max(sub.min, Math.round(price/5)*5);
}

function commonAreaSelectionsTotal(property){
  let total = 0;
  Object.entries(state.bookingCommonAreaSelections).forEach(([key, val]) => {
    if(val && val.checked){
      const sub = state.commonAreaSubOptions.find(s => s.key === key);
      if(sub) total += calcCommonAreaSubPriceClient(sub, {
        floorCount: property?.floor_count, sqmPerFloor: property?.sqm_per_floor, elevatorCapacity: property?.elevator_capacity,
      });
    }
  });
  return total;
}

function buildReceiptLines(draft){
  const service = state.services.find(s => s.key === draft.serviceKey);
  const isGroup = !!service.isGroup;
  const lines = [];

  if(isGroup){
    const props = [...state.properties.owned, ...state.properties.delegated];
    const property = props.find(p => p.id === draft.propertyId);
    (draft.serviceParams?.selections || []).forEach(sel => {
      const sub = state.commonAreaSubOptions.find(s => s.key === sel.key);
      if(sub) lines.push({ label: `${commonAreaSubIcon(sel.key)} ${commonAreaSubLabel(sel.key)}`, amount: calcCommonAreaSubPriceClient(sub, {
        floorCount: property?.floor_count, sqmPerFloor: property?.sqm_per_floor, elevatorCapacity: property?.elevator_capacity,
      }) });
    });
    if(draft.hasEquipment === false) lines.push({ label: t('noEquipmentFeeLabel'), amount: SUPPLIES_FEES.noEquipment });
    if(draft.hasChemicals === false) lines.push({ label: t('noChemicalsFeeLabel'), amount: SUPPLIES_FEES.noChemicals });
    const total = lines.reduce((s,l) => s+l.amount, 0);
    return { lines, total, property };
  }

  const label = serviceLabel(draft.serviceKey);
  const props = [...state.properties.owned, ...state.properties.delegated];
  const property = props.find(p => p.id === draft.propertyId);
  const basePrice = calcPriceClient(service, { sizeSqm: property?.size_sqm });
  lines.push({ label: label.name, amount: basePrice });
  if(draft.hasEquipment === false) lines.push({ label: t('noEquipmentFeeLabel'), amount: SUPPLIES_FEES.noEquipment });
  if(draft.hasChemicals === false) lines.push({ label: t('noChemicalsFeeLabel'), amount: SUPPLIES_FEES.noChemicals });
  (draft.addons||[]).forEach(a => {
    const addon = state.addons.find(x => x.key === a.key);
    if(addon) lines.push({ label: `${addonIcon(a.key)} ${addonLabel(a.key)} × ${a.quantity}`, amount: addon.rate * a.quantity });
  });
  const total = lines.reduce((s,l) => s+l.amount, 0);
  return { lines, total, property };
}

function renderBookingPanel(service, props, selectedProperty){
  if(state.bookingStep === 'checklist' && state.pendingBooking && state.pendingBooking.serviceKey === service.key){
    return renderChecklistPanel(state.pendingBooking, service);
  }
  if(state.bookingStep === 'receipt' && state.pendingBooking && state.pendingBooking.serviceKey === service.key){
    return renderReceiptPanel(state.pendingBooking);
  }
  if(state.bookingStep === 'extras'){
    return renderExtrasStep(service, props, selectedProperty);
  }
  return renderConfigStep(service, props, selectedProperty);
}

// 1. Ekran: hangi mülk, hangi alt hizmetler (Ortak Alan'da), ne zaman.
// Malzeme var/yok ve ekstra hizmetler (halı/koltuk) burada SORULMUYOR -
// bunlar 2. ekrana taşındı.
function renderConfigStep(service, props, selectedProperty){
  const isGroup = !!service.isGroup;

  if(isGroup){
    const commonAreaProps = [...state.properties.owned, ...state.properties.delegated].filter(p => p.category === 'common_area');
    if(commonAreaProps.length === 0){
      return `<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);"><div class="hint" style="margin:0;">${t('noBuildingGroupsHint')}</div></div>`;
    }
    const selectedCaProperty = commonAreaProps.find(p => p.id === state.bookingPropertyId) || commonAreaProps[0];
    const subChecked = (key) => state.bookingCommonAreaSelections[key]?.checked;

    return `
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
      ${commonAreaProps.length > 1 ? `
      <div class="field">
        <label>${t('bookingBuildingLabel')}</label>
        <select id="booking-ca-property-select">
          ${commonAreaProps.map(p => `<option value="${p.id}" ${p.id===selectedCaProperty.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      ` : ''}

      <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;">${t('commonAreaCleaning')}</div>
      ${state.commonAreaSubOptions.map(sub => {
        const missingFloor = (sub.paramType === 'floors' || sub.paramType === 'corridor') && !selectedCaProperty.floor_count;
        const missingSqm = sub.paramType === 'corridor' && !selectedCaProperty.sqm_per_floor;
        const missingElevator = sub.paramType === 'elevator' && !selectedCaProperty.elevator_capacity;
        const disabled = missingFloor || missingSqm || missingElevator;
        const preview = !disabled ? calcCommonAreaSubPriceClient(sub, {
          floorCount: selectedCaProperty.floor_count, sqmPerFloor: selectedCaProperty.sqm_per_floor, elevatorCapacity: selectedCaProperty.elevator_capacity,
        }) : null;
        return `
        <div style="margin-bottom:10px; padding:10px; border:1px solid var(--line); border-radius:8px; ${disabled?'opacity:.55;':''}">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:${disabled?'not-allowed':'pointer'};">
            <input type="checkbox" data-common-area-toggle="${sub.key}" ${subChecked(sub.key) ? 'checked' : ''} ${disabled?'disabled':''} />
            <span style="color:var(--navy);">${commonAreaSubIcon(sub.key)}</span>
            <span style="flex:1;">${commonAreaSubLabel(sub.key)}</span>
            ${preview !== null ? `<span style="color:var(--muted); font-size:12px;">${preview}€</span>` : ''}
          </label>
          ${missingElevator ? `<div class="hint" style="margin:6px 0 0 26px;">${t('elevatorCapacityMissingHint')}</div>` : ''}
          ${(missingFloor || missingSqm) && !missingElevator ? `<div class="hint" style="margin:6px 0 0 26px;">${t('floorCountMissingHint')}</div>` : ''}
        </div>
      `}).join('')}

      <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 8px;">${t('whenLabel')}</div>
      <div class="option-row">
        <div class="choice ${state.bookingUrgency==='urgent'?'selected':''}" data-urgency="urgent">${t('urgent')}</div>
        <div class="choice ${state.bookingUrgency==='scheduled'?'selected':''}" data-urgency="scheduled">${t('scheduleOpt')}</div>
      </div>
      ${state.bookingUrgency==='scheduled' ? `
        <div class="field"><label>${t('datetimeLabel')}</label><input type="datetime-local" id="booking-datetime" value="${state.bookingScheduledAt}" /></div>
      ` : ''}

      <button class="btn ochre btn-sm" style="width:100%; margin-top:6px;" data-goto-extras="${service.key}">${t('continueBtn')}</button>
    </div>
    `;
  }

  // Ofis / Dükkan / Çalışma Alanı Temizliği: sadece "Ofis / İşyeri"
  // kategorili mülkler seçilebilir. Hiç yoksa sipariş oluşturulamaz.
  let effectiveProps = props;
  let effectiveSelectedProperty = selectedProperty;
  if(service.key === 'office'){
    effectiveProps = props.filter(p => p.category === 'office');
    if(effectiveProps.length === 0){
      return `
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line); text-align:center;">
        <div class="property-avatar" style="margin:0 auto 12px;"><img src="${categoryIconSrc('office')}" alt="" /></div>
        <div class="hint" style="margin:0;">${t('noOfficePropertyHint')}</div>
        <button type="button" class="btn ochre btn-sm" id="goto-add-property-office" style="width:auto; margin-top:14px;">${t('addPropertyCta')}</button>
      </div>
      `;
    }
    effectiveSelectedProperty = effectiveProps.find(p => p.id === state.bookingPropertyId) || effectiveProps[0];
  }

  return `
  <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
    ${effectiveProps.length > 1 ? `
      <div class="field">
        <label>${t('bookingPropertyLabel')}</label>
        <select id="booking-property-select">
          ${effectiveProps.map(p => `<option value="${p.id}" ${p.id===effectiveSelectedProperty.id?'selected':''}>${p.name}${p.size_sqm ? ' ('+p.size_sqm+' m²)' : ''}</option>`).join('')}
        </select>
      </div>
    ` : ''}

    <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;">${t('whenLabel')}</div>
    <div class="option-row">
      <div class="choice ${state.bookingUrgency==='urgent'?'selected':''}" data-urgency="urgent">${t('urgent')}</div>
      <div class="choice ${state.bookingUrgency==='scheduled'?'selected':''}" data-urgency="scheduled">${t('scheduleOpt')}</div>
    </div>
    ${state.bookingUrgency==='scheduled' ? `
      <div class="field">
        <label>${t('datetimeLabel')}</label>
        <input type="datetime-local" id="booking-datetime" value="${state.bookingScheduledAt}" />
      </div>
    ` : ''}

    <button class="btn ochre btn-sm" style="width:100%; margin-top:6px;" data-goto-extras="${service.key}">${t('continueBtn')}</button>
  </div>
  `;
}

// 2. Ekran: malzeme (ekipman/kimyasal) var/yok + ekstra hizmetler (halı/koltuk
// yıkama). Buradan "Devam Et" ile checklist adımına geçilir (mevcut
// data-goto-receipt handler'ı taslağı burada oluşturup checklist'e yönlendiriyor).
function renderExtrasStep(service, props, selectedProperty){
  const isGroup = !!service.isGroup;
  const suppliesFee = (state.bookingHasEquipment?0:SUPPLIES_FEES.noEquipment) + (state.bookingHasChemicals?0:SUPPLIES_FEES.noChemicals);

  let effectiveSelectedProperty = selectedProperty;
  let runningTotal;
  if(isGroup){
    const commonAreaProps = [...state.properties.owned, ...state.properties.delegated].filter(p => p.category === 'common_area');
    effectiveSelectedProperty = commonAreaProps.find(p => p.id === state.bookingPropertyId) || commonAreaProps[0];
    runningTotal = commonAreaSelectionsTotal(effectiveSelectedProperty) + suppliesFee;
  } else {
    effectiveSelectedProperty = (service.key === 'office' ? props.filter(p => p.category === 'office') : props).find(p => p.id === state.bookingPropertyId) || effectiveSelectedProperty;
    runningTotal = calcPriceClient(service, { sizeSqm: effectiveSelectedProperty?.size_sqm }) + suppliesFee + bookingAddonsTotal();
  }

  const addonChecked = (key) => state.bookingAddons[key]?.checked;
  const addonQty = (key) => state.bookingAddons[key]?.quantity || 1;

  return `
  <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
    <h3 style="font-size:15px; margin-bottom:12px;">${t('extrasStepTitle')}</h3>

    <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;">${t('suppliesLabel')}</div>
    <div class="hint" style="margin:0 0 10px;">${t('suppliesFeeHint')}</div>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:4px;">${t('equipmentLabel')}</div>
    <div class="option-row">
      <div class="choice ${state.bookingHasEquipment?'selected':''}" data-equipment="true">${t('availableOpt')}</div>
      <div class="choice ${!state.bookingHasEquipment?'selected':''}" data-equipment="false">${t('notAvailableOpt')} (+${SUPPLIES_FEES.noEquipment}€)</div>
    </div>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:4px;">${t('chemicalsLabel')}</div>
    <div class="option-row">
      <div class="choice ${state.bookingHasChemicals?'selected':''}" data-chemicals="true">${t('availableOpt')}</div>
      <div class="choice ${!state.bookingHasChemicals?'selected':''}" data-chemicals="false">${t('notAvailableOpt')} (+${SUPPLIES_FEES.noChemicals}€)</div>
    </div>

    ${!isGroup ? `
      <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 8px;">${t('extrasLabel')}</div>
      ${state.addons.map(a => `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <label style="display:flex; align-items:center; gap:8px; flex:1; font-size:13px; cursor:pointer;">
            <input type="checkbox" data-addon-toggle="${a.key}" ${addonChecked(a.key) ? 'checked' : ''} />
            <span style="color:var(--navy);">${addonIcon(a.key)}</span> ${addonLabel(a.key)} <span style="color:var(--muted); font-size:12px;">(+${a.rate}€)</span>
          </label>
          ${addonChecked(a.key) ? `<input type="number" min="1" data-addon-qty="${a.key}" value="${addonQty(a.key)}" style="width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;" />` : ''}
        </div>
      `).join('')}
    ` : ''}

    <div class="price" style="margin:14px 0 10px;">${runningTotal} € <span style="font-size:12px;color:var(--muted);font-family:Inter">${t('totalLabel')}</span></div>

    <button class="btn ochre btn-sm" style="width:100%; margin-bottom:8px;" data-goto-receipt="${service.key}">${t('continueBtn')}</button>
    <button class="btn ghost btn-sm" style="width:100%;" data-back-to-config="true">${t('backBtn')}</button>
  </div>
  `;
}

// Ödemeye geçmeden önce müşteriye "bu hizmette tam olarak ne yapılacak"
// gösterilen ara adım. Tekli hizmetlerde doğrudan o hizmetin checklist'i,
// Ortak Alan gibi grup hizmetlerde seçilen tüm alt hizmetlerin checklist'leri
// birleştirilip gösteriliyor.
function renderChecklistPanel(draft, service){
  const isGroup = !!service.isGroup;
  let sections = [];
  if(isGroup){
    const selections = (draft.serviceParams && draft.serviceParams.selections) || [];
    sections = selections.map(sel => {
      const sub = state.commonAreaSubOptions.find(s => s.key === sel.key);
      return sub ? { label: commonAreaSubLabel(sel.key), items: sub.checklist || [] } : null;
    }).filter(Boolean);
  } else {
    sections = [{ label: serviceLabel(draft.serviceKey).name, items: service.checklist || [] }];
  }
  const hasAnyItems = sections.some(s => s.items.length > 0);

  return `
  <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
    <h3 style="font-size:15px; margin-bottom:4px;">${t('checklistStepTitle')}</h3>
    <div class="hint" style="margin:0 0 14px;">${t('checklistStepHint')}</div>

    ${!hasAnyItems ? `<div class="empty-state" style="margin-bottom:16px;">${t('checklistEmptyState')}</div>` : sections.map(sec => `
      <div style="border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:var(--bg);">
        ${sections.length > 1 ? `<div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;">${sec.label}</div>` : ''}
        ${sec.items.length === 0 ? `<div style="font-size:12.5px; color:var(--muted);">${t('checklistSectionEmpty')}</div>` : `
          <ul style="margin:0; padding:0; list-style:none;">
            ${sec.items.map(item => `
              <li style="display:flex; align-items:flex-start; gap:8px; font-size:13.5px; padding:5px 0;">
                <span style="color:var(--sage-dark); flex-shrink:0; margin-top:1px;">✓</span>
                <span>${item.item_text}</span>
              </li>
            `).join('')}
          </ul>
        `}
      </div>
    `).join('')}

    <button class="btn ochre btn-sm" style="width:100%; margin-bottom:8px;" data-continue-to-payment="true">${t('continueToPaymentBtn')}</button>
    <button class="btn ghost btn-sm" style="width:100%;" data-back-to-extras="true">${t('backBtn')}</button>
  </div>
  `;
}

function renderReceiptPanel(draft){
  const { lines, total } = buildReceiptLines(draft);

  const discountAmount = (promo && promo.discountAmount) ? promo.discountAmount : 0;
  const finalTotal = Math.max(0, Math.round((total - discountAmount) * 100) / 100);
  const isCompany = state.user.accountType === 'company';
  const paymentMethod = draft.paymentMethod;
  return `
  <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
    <h3 style="font-size:15px; margin-bottom:12px;">${t('receiptTitle')}</h3>
    <div style="border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; background:var(--bg);">
      ${lines.map(l => `
        <div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0;">
          <span>${l.label}</span><span>${l.amount} €</span>
        </div>
      `).join('')}
      ${discountAmount > 0 ? `
        <div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--sage-dark);">
          <span>${t('promoDiscountLabel')} (${state.promoCodeInput.toUpperCase()})</span><span>-${discountAmount} €</span>

      ` : ''}
      <div style="display:flex; justify-content:space-between; font-family:'Fraunces',serif; font-size:17px; color:var(--navy); border-top:1px dashed var(--line); margin-top:8px; padding-top:10px;">
        <span>${t('receiptTotalLabel')}</span><span>${finalTotal} €</span>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="display:flex; gap:8px;">
        <input id="promo-code-input" placeholder="${t('promoCodePlaceholder')}" value="${state.promoCodeInput}" style="flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; text-transform:uppercase;" />
        <button type="button" class="btn ghost btn-sm" id="apply-promo-btn" style="width:auto;">${t('applyPromoBtn')}</button>
      </div>
      ${promo && promo.error ? `<div class="error-msg" style="margin:6px 0 0;">${promo.error}</div>` : ''}
      ${promo && promo.discountAmount ? `<div style="font-size:12px; color:var(--sage-dark); margin-top:6px;">${t('promoAppliedHint')}</div>` : ''}
    </div>

    <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;">${t('paymentMethodLabel')}</div>
    <div class="option-row">
      <div class="choice ${paymentMethod==='cash'?'selected':''}" data-payment-method="cash">${t('cashLabel')}<br/><span style="font-weight:400; font-size:11px;">${t('cashSub')}</span></div>
      <div class="choice ${paymentMethod==='card'?'selected':''}" data-payment-method="card">${t('cardLabel')}<br/><span style="font-weight:400; font-size:11px;">${t('cardSub')}</span></div>
      ${isCompany ? `<div class="choice ${paymentMethod==='invoice'?'selected':''}" data-payment-method="invoice">${t('invoiceLabel')}<br/><span style="font-weight:400; font-size:11px;">${t('invoiceSub')}</span></div>` : ''}
    </div>
    ${paymentMethod==='card' && state.savedCard ? `
      <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:13px;">
        <span>${state.savedCard.brand} •••• ${state.savedCard.last4} <span style="color:var(--muted);">(${String(state.savedCard.expMonth).padStart(2,'0')}/${state.savedCard.expYear})</span></span>
        <span id="change-card" style="font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;">${t('changeCard')}</span>
      </div>
    ` : ''}

    ${paymentMethod ? `<div style="font-size:12px; color:var(--muted); margin-bottom:14px;">${paymentNote(paymentMethod)}</div>` : ''}
    <button class="btn ochre btn-sm" style="width:100%; margin-bottom:8px;" data-confirm-booking="true">${t('confirmPaymentBtn')}</button>
    <button class="btn ghost btn-sm" style="width:100%;" data-back-to-checklist="true">${t('backBtn')}</button>
  </div>
  `;
}

function renderPropertyUnitRow(p){
  return `
  <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line);">
    <div style="width:34px; height:34px; border-radius:9px; overflow:hidden; flex-shrink:0;"><img src="${categoryIconSrc(p.category)}" alt="" style="width:100%;height:100%;object-fit:cover;" /></div>
    <div style="flex:1; min-width:0;">

    </div>
    <div style="display:flex; gap:6px; flex-shrink:0;">

      <button class="btn ghost btn-sm" style="width:auto; padding:6px 10px; font-size:11.5px;" data-edit-property="${p.id}">${t('editBtn')}</button>
    </div>
  </div>`;
}

function renderProperties(){
  const props = [...state.properties.owned, ...state.properties.delegated];

  // Aynı bina/site adını paylaşan 2+ mülk tek bir grup kartında toplanır -
  // 10-20 dairelik yönetim şirketi portföylerinin ekranı doldurmaması için.
  const groups = {};
  const ungrouped = [];
  props.forEach(p => {
    if(p.building_name && p.building_name.trim()){
      const key = p.building_name.trim();
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    } else {
      ungrouped.push(p);
    }
  });
  const groupEntries = Object.entries(groups).filter(([, list]) => list.length > 1);
  const singleBuildingLeftovers = Object.entries(groups).filter(([, list]) => list.length === 1).flatMap(([, list]) => list);
  const individualProps = [...ungrouped, ...singleBuildingLeftovers];

  return `
  <div class="page-head">
    <div>
      <h2>${t('propertiesTitle')}</h2>
      <p>${t('propertiesSubtitle')}</p>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn ochre" id="add-property">${t('addPropertyCta')}</button>
    ${state.user.accountType==='company' ? `<button class="btn ghost" id="bulk-add-open">${t('bulkAddBtn')}</button>` : ''}
  </div>
  ${props.length === 0 ? `
    <div class="empty-state">${t('propertiesEmptyState')}</div>
  ` : `
    <div class="grid">
      ${groupEntries.map(([buildingName, list]) => {
        const isExpanded = !!state.expandedGroups[buildingName];
        const firstCity = list.find(p => p.city)?.city;
        return `
        <div class="card">
          <div class="property-avatar"><img src="${categoryIconSrc(list[0].category)}" alt="" /></div>
          <h3>${buildingName}</h3>
          <div class="meta" style="margin-bottom:14px;">${t('unitsCountLabel', { count: list.length })}${firstCity ? ' · ' + firstCity : ''}</div>
          <div class="row-actions">
            <button class="btn ghost btn-sm" data-toggle-group="${buildingName}">${isExpanded ? t('collapseGroupBtn') : t('expandGroupBtn')}</button>
          </div>
          ${isExpanded ? `<div>${list.map(p => renderPropertyUnitRow(p)).join('')}</div>` : ''}
        </div>
      `}).join('')}
      ${individualProps.map(p => `
        <div class="card">
          <div class="property-avatar"><img src="${categoryIconSrc(p.category)}" alt="" /></div>
          <h3>${p.name}</h3>
          <div class="meta" style="margin-bottom:14px;">${categoryLabel(p.category)} · ${p.city || t('cityUnknown')}${p.size_sqm ? ' · ' + p.size_sqm + ' m²' : ''}${p.category!=='office' ? (p.ical_url ? ' · ' + t('icalLinked') : ' · ' + t('icalNotLinked')) : ''}</div>
          <div class="row-actions">
            <button class="btn ochre btn-sm" data-book="${p.id}">${t('requestServiceBtn')}</button>
            ${p.category!=='office' ? `<button class="btn ghost btn-sm" data-sync="${p.id}" data-current-ical="${p.ical_url || ''}">${t('syncDemoBtn')}</button>` : ''}
            <button class="btn ghost btn-sm" data-edit-property="${p.id}">${t('editBtn')}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `}
  `;
}

function categoryLabel(cat){
  const map = { apartment:'categoryApartment', house:'categoryHouse', office:'categoryOffice', common_area:'categoryCommonArea' };
  return t(map[cat] || 'categoryApartment');
}

function serviceName(key){
  return serviceLabel(key).name;
}

            <td><strong>${j.building_name || j.property_name}</strong><br/><span style="color:var(--muted);font-size:12px">${j.property_city||''}</span></td>
            <td>${j.service_key==='common_area' ? renderCommonAreaJobSummary(j) : serviceName(j.service_key)}${renderAddonsSummary(j.addons)}</td>
            <td>${j.urgency==='urgent' ? t('urgent') : j.urgency==='now' ? t('now') : new Date(j.checkout_at).toLocaleString(LOCALES[state.lang],{dateStyle:'medium',timeStyle:'short'})}</td>
            <td><span class="badge ${j.status}">${statusLabel(j.status)}</span></td>
            <td>${renderAssignedStaff(j)}</td>
            <td>${j.price} €</td>
            <td>${renderJobAction(j)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `}
  `;
}

function renderAssignedStaff(j){
  if(!j.staff_name){
    return `<span style="font-size:12px; color:var(--muted);">${t('staffNotAssignedYet')}</span>`;
  }
  const initial = j.staff_name.charAt(0).toUpperCase();
  return `
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="width:22px; height:22px; border-radius:50%; background:var(--sage); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${initial}</span>
      <span style="font-size:13px;">${j.staff_name}</span>
    </div>
  `;
}

function renderJobAction(j){
  if(j.payment_status === 'released'){
    return `<span class="pay-badge released">${t('paidBadge')}</span>`;
  }
  if(!['done','confirmed'].includes(j.status)){
    return `
      <span class="pay-badge" style="background:var(--bg); color:var(--muted);">${statusLabel(j.status)}</span>
      <div style="font-size:11px; color:var(--muted); margin-top:4px;">${paymentNote(j.payment_method)}</div>
      ${['pending','assigned'].includes(j.status) ? `<button type="button" class="btn ghost btn-sm" style="width:auto; margin-top:6px; padding:5px 10px; font-size:11px; color:var(--danger); border-color:#e6c3b3;" data-cancel-job="${j.id}">${t('cancelOrderBtn')}</button>` : ''}
    `;
  }
  return `<span class="pay-badge held">${t('settlingBadge')}</span>`;
}

function renderCommonAreaJobSummary(j){
  try{
    const selections = JSON.parse(j.service_params || '{}').selections || [];
    return selections.map(sel => `<span>${commonAreaSubIcon(sel.key)} ${commonAreaSubLabel(sel.key)}</span>`).join('<br/>');
  }catch(e){ return serviceName(j.service_key); }
}

function renderAddonsSummary(addonsJson){
  if(!addonsJson) return '';
  try{
    const list = JSON.parse(addonsJson);
    return list.map(a => ` <span style="color:var(--muted); font-size:12px;">+ ${addonLabel(a.key)} (${a.quantity})</span>`).join('');
  }catch(e){ return ''; }
}

async function loadAll(){
  const calls = [ api('/properties'), api('/jobs'), api('/payment-methods') ];
  if(state.services.length === 0) calls.push(api('/services'));
  const results = await Promise.all(calls);
  state.properties = results[0];
  state.jobs = results[1];
  state.savedCard = results[2];
  if(results[3]){
    state.services = results[3].services;
    state.commonAreaSubOptions = results[3].commonAreaSubOptions || [];
    state.addons = results[3].addons;
  }
  state.ratingJob = findNextRatingJob();
  render();
}

// Kayıt sırasında haritayı varsayılan olarak müşterinin telefon konumuna
// ortalamak için kullanılıyor. İzin verilmezse/başarısız olursa sessizce
// null döner - harita o zaman Karadağ geneline (varsayılan görünüme) açılır,
// müşteri şehir seçince ya da elle tıklayınca konumlanır.
// <input type="datetime-local"> ham değeri (örn. "2026-08-15T14:00") hiçbir
// saat dilimi bilgisi taşımaz - backend'e bu haliyle gönderilirse, sunucu
// bunu KENDİ saat diliminde (genelde UTC) yorumlar, müşterinin gerçekte
// seçtiği yerel saatten 1-2 saat kayar. Bu yüzden dönüşümü, müşterinin
// gerçek yerel saat dilimini bilen TARAYICIDA yapıp, sunucuya her zaman
// kesin (Z'li) bir UTC zaman damgası gönderiyoruz.
function localDatetimeToUtcIso(naiveLocalValue){
  if(!naiveLocalValue) return naiveLocalValue;
  return new Date(naiveLocalValue).toISOString();
}

function attemptPhoneGeolocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 6000, maximumAge: 60000 }
    );
  });
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// Bildirim izni ister ve push aboneliğini backend'e kaydeder - "siparişin
// onaylandı" gibi bildirimleri alabilmek için. İzin verilmezse (ya da
// tarayıcı desteklemiyorsa) sessizce geçer, müşteri yine de Siparişlerim
// sekmesinden durumu takip edebilir.
async function ensurePushSubscription(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') return false;

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const { publicKey } = await fetch(API + '/push/vapid-public-key').then(r => r.json());
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    await api('/push/subscribe', { method:'POST', body: JSON.stringify(sub.toJSON()) });
    return true;
  }catch(e){ return false; }
}

async function submitBooking(draft){

    // Siparişin onaylandığını (personel kabul ettiğinde) bildirim olarak
    // alabilmesi için - ilk siparişte bir kereye mahsus izin isteniyor,
    // sonraki siparişlerde tarayıcı zaten hatırlıyor.
    ensurePushSubscription();
  }catch(err){ showToast(err.message); }
}

  document.querySelectorAll('[data-goto-receipt]').forEach(el => el.onclick = () => {
    const serviceKey = el.dataset.gotoReceipt;
    const isGroup = serviceKey === 'common_area';

    let draft;
    if(isGroup){
      const selections = Object.entries(state.bookingCommonAreaSelections)
        .filter(([, v]) => v && v.checked)
        .map(([key]) => ({ key }));
      const commonAreaProps = [...state.properties.owned, ...state.properties.delegated].filter(p => p.category === 'common_area');
      const propertyId = state.bookingPropertyId || commonAreaProps[0]?.id;
      if(!propertyId) return;
      draft = {
        propertyId, serviceKey,
        urgency: state.bookingUrgency,
        scheduledAt: state.bookingUrgency === 'scheduled' ? localDatetimeToUtcIso(state.bookingScheduledAt) : undefined,
        hasEquipment: state.bookingHasEquipment,
        hasChemicals: state.bookingHasChemicals,
        addons: [],
        serviceParams: { selections },
      };
    } else {
      const props = [...state.properties.owned, ...state.properties.delegated];
      const eligibleProps = serviceKey === 'office' ? props.filter(p => p.category === 'office') : props;
      const propertyId = state.bookingPropertyId || eligibleProps[0]?.id;
      if(!propertyId) return;
      const addons = Object.entries(state.bookingAddons)
        .filter(([, v]) => v && v.checked)
        .map(([key, v]) => ({ key, quantity: v.quantity || 1 }));
      draft = {
        propertyId, serviceKey,
        urgency: state.bookingUrgency,
        scheduledAt: state.bookingUrgency === 'scheduled' ? localDatetimeToUtcIso(state.bookingScheduledAt) : undefined,
        hasEquipment: state.bookingHasEquipment,
        hasChemicals: state.bookingHasChemicals,
        addons,
      };
    }

    state.pendingBooking = draft;
    state.bookingStep = 'checklist';
    render();
    resetBookingOverlayScroll();
  });

  const backToConfig = document.querySelector('[data-back-to-config]');
  if(backToConfig) backToConfig.onclick = () => { state.bookingStep = 'config'; render(); resetBookingOverlayScroll(); };

  const backToExtras = document.querySelector('[data-back-to-extras]');
  if(backToExtras) backToExtras.onclick = () => { state.bookingStep = 'extras'; render(); resetBookingOverlayScroll(); };

  const backToChecklist = document.querySelector('[data-back-to-checklist]');
  if(backToChecklist) backToChecklist.onclick = () => { state.bookingStep = 'checklist'; render(); resetBookingOverlayScroll(); };

  const continueToPayment = document.querySelector('[data-continue-to-payment]');
  if(continueToPayment) continueToPayment.onclick = () => { state.bookingStep = 'receipt'; render(); resetBookingOverlayScroll(); };

  const applyPromoBtn = document.getElementById('apply-promo-btn');
  if(applyPromoBtn) applyPromoBtn.onclick = async () => {
    const input = document.getElementById('promo-code-input');
    const code = input.value.trim();
    state.promoCodeInput = code;
    if(!code){ state.promoValidation = null; render(); return; }
    const draft = state.pendingBooking;
    if(!draft) return;
    const { total } = buildReceiptLines(draft);
    try{
      const result = await api('/jobs/validate-promo', { method:'POST', body: JSON.stringify({
        code, propertyId: draft.propertyId, serviceKey: draft.serviceKey, priceBeforeDiscount: total,
      })});
      state.promoValidation = result;
    }catch(err){
      state.promoValidation = { error: err.message };
    }
    render();
  };

  const confirmBooking = document.querySelector('[data-confirm-booking]');
  if(confirmBooking) confirmBooking.onclick = async () => {
    if(!state.pendingBooking) return;
    if(!state.pendingBooking.paymentMethod){
      showToast(t('pleaseSelectPaymentMethod'));
      return;
    }
    const bookingToSubmit = { ...state.pendingBooking };
    if(state.promoValidation && state.promoValidation.discountAmount){
      bookingToSubmit.promoCode = state.promoCodeInput;
    }
    await submitBooking(bookingToSubmit);
    state.bookingStep = 'config';
    state.pendingBooking = null;
    state.promoCodeInput = '';
    state.promoValidation = null;
  };

  document.querySelectorAll('[data-cancel-job]').forEach(el => el.onclick = () => {
    state.cancelJobTargetId = el.dataset.cancelJob;
    state.modal = 'cancel-order';
    render();
  });

  const cancelOrderConfirm = document.getElementById('cancel-order-confirm');
  if(cancelOrderConfirm) cancelOrderConfirm.onclick = async () => {
    const reasonInput = document.getElementById('cancel-order-reason');
    try{
      await api(`/jobs/${state.cancelJobTargetId}/cancel`, { method:'POST', body: JSON.stringify({ reason: reasonInput ? reasonInput.value : '' }) });
      state.modal = null; state.cancelJobTargetId = null;
      showToast(t('toastOrderCancelled'));
      await loadAll();
    }catch(err){ showToast(err.message); state.modal = null; state.cancelJobTargetId = null; render(); }
  };

  const modalCancel = document.getElementById('modal-cancel');
  if(modalCancel) modalCancel.onclick = () => {
    state.modal = null; state.regLat = null; state.regLng = null;
    state.pendingBooking = null; state.pendingSyncPropertyId = null;
    state.syncPropertyId = null; state.syncStep = 'url'; state.syncIcalUrl = ''; state.syncUseDemo = false;
    state.cancelJobTargetId = null; state.editPropertyId = null; state.regPropertyCity = '';
    state.authError=''; render();
  };

  const changeCard = document.getElementById('change-card');
  if(changeCard) changeCard.onclick = () => { state.modal = 'card-form'; state.pendingBooking = null; render(); };

  const cardForm = document.getElementById('card-form');
  if(cardForm) cardForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(cardForm));
    try{
      const card = await api('/payment-methods', { method:'POST', body: JSON.stringify({
        cardNumber: fd.cardNumber, expMonth: fd.expMonth, expYear: fd.expYear, holderName: fd.holderName,
      })});
      state.savedCard = card;
      state.modal = null;
      state.authError = '';
      if(state.pendingSyncPropertyId){
        const propId = state.pendingSyncPropertyId;
        state.pendingSyncPropertyId = null;
        await performSync(propId, 'card');
      } else if(state.pendingBooking){
        state.pendingBooking = { ...state.pendingBooking, paymentMethod: 'card' };
        render();
      } else {
        showToast(t('toastCardSaved'));
        if(state.syncPropertyId) state.modal = 'sync-payment';
        render();
      }
    }catch(err){ state.authError = err.message; render(); }
  };

  const modalPropCity = document.getElementById('modal-property-city');
  if(modalPropCity) modalPropCity.onchange = () => { state.regPropertyCity = modalPropCity.value; };

  document.querySelectorAll('[data-edit-property]').forEach(el => el.onclick = () => {
    const allProps = [...state.properties.owned, ...state.properties.delegated];
    const p = allProps.find(x => x.id === el.dataset.editProperty);
    if(!p) return;
    state.editPropertyId = p.id;
    state.regPropertyCity = p.city || '';
    state.regLat = p.latitude || null;
    state.regLng = p.longitude || null;
    state.modal = 'edit-property';
    render();
  });

  const editPropCity = document.getElementById('edit-property-city');
  if(editPropCity) editPropCity.onchange = () => { state.regPropertyCity = editPropCity.value; };

  const editPropertyForm = document.getElementById('edit-property-form');
  if(editPropertyForm) editPropertyForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(editPropertyForm));
    try{
      await api(`/properties/${state.editPropertyId}`, { method:'PUT', body: JSON.stringify({
        name: fd.name, city: fd.city, address: fd.address || null,
        sizeSqm: fd.sizeSqm || null, floorCount: fd.floorCount || null,
        sqmPerFloor: fd.sqmPerFloor || null, elevatorCapacity: fd.elevatorCapacity || null,
        latitude: state.regLat, longitude: state.regLng,
      })});
      state.modal = null; state.editPropertyId = null;
      state.regLat = null; state.regLng = null; state.regPropertyCity = '';
      showToast(t('toastPropertyUpdated'));
      await loadAll();
    }catch(err){ showToast(err.message); }
  };

  const modalDeleteProperty = document.getElementById('modal-delete-property');
  if(modalDeleteProperty) modalDeleteProperty.onclick = () => { state.modal = 'confirm-delete-property'; render(); };

  const modalCancelDelete = document.getElementById('modal-cancel-delete');
  if(modalCancelDelete) modalCancelDelete.onclick = () => { state.modal = 'edit-property'; render(); };

  const confirmDeletePropertyBtn = document.getElementById('confirm-delete-property-btn');
  if(confirmDeletePropertyBtn) confirmDeletePropertyBtn.onclick = async () => {
    try{
      await api(`/properties/${state.editPropertyId}`, { method:'DELETE' });
      state.modal = null; state.editPropertyId = null;
      state.regLat = null; state.regLng = null; state.regPropertyCity = '';
      showToast(t('toastPropertyDeleted'));
      await loadAll();
    }catch(err){
      showToast(err.message);
      state.modal = 'edit-property'; render();
    }
  };

  const propForm = document.getElementById('property-form');
  if(propForm) propForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(propForm));
    const isCommonArea = state.propertyCategory === 'common_area';
    await api('/properties', { method:'POST', body: JSON.stringify({
      name: fd.name,
      city: fd.city || null, address: fd.address || null,
      category: state.propertyCategory,
      buildingName: isCommonArea ? null : (fd.buildingName || null),
      latitude: state.regLat, longitude: state.regLng,
      sizeSqm: isCommonArea ? null : (fd.sizeSqm || null),
      icalUrl: isCommonArea ? null : (fd.icalUrl || null),
      floorCount: isCommonArea ? (fd.floorCount || null) : null,
      sqmPerFloor: isCommonArea ? (fd.sqmPerFloor || null) : null,
      elevatorCapacity: isCommonArea ? (fd.elevatorCapacity || null) : null,
    })});
    state.modal = null;
    state.regLat = null; state.regLng = null;
    await loadAll();
  };

  document.querySelectorAll('[data-book]').forEach(el => el.onclick = () => {
    state.bookingPropertyId = el.dataset.book;
    state.page = 'services';
    render();
  });

  document.querySelectorAll('[data-toggle-group]').forEach(el => el.onclick = () => {
    const key = el.dataset.toggleGroup;
    state.expandedGroups[key] = !state.expandedGroups[key];
    render();
  });

  document.querySelectorAll('[data-sync]').forEach(el => el.onclick = () => {
    state.syncPropertyId = el.dataset.sync;
    state.syncIcalUrl = el.dataset.currentIcal || '';
    state.syncUseDemo = false;
    state.syncStep = 'url';
    state.syncPaymentMethod = 'cash';
    state.modal = 'sync-payment';
    render();
  });

  const syncIcalUrlInput = document.getElementById('sync-ical-url-input');
  if(syncIcalUrlInput) syncIcalUrlInput.oninput = () => { state.syncIcalUrl = syncIcalUrlInput.value; };

  const syncUrlContinue = document.getElementById('sync-url-continue');
  if(syncUrlContinue) syncUrlContinue.onclick = () => {
    if(!state.syncIcalUrl.trim()){
      showToast(t('pleaseEnterIcalUrl')); return;
    }
    state.syncUseDemo = false;
    state.syncStep = 'payment';
    render();
  };

  const syncUseDemo = document.getElementById('sync-use-demo');
  if(syncUseDemo) syncUseDemo.onclick = () => {
    state.syncUseDemo = true;
    state.syncIcalUrl = '';
    state.syncStep = 'payment';
    render();
  };

  const syncBackToUrl = document.getElementById('sync-back-to-url');
  if(syncBackToUrl) syncBackToUrl.onclick = () => { state.syncStep = 'url'; render(); };

  document.querySelectorAll('[data-sync-payment-method]').forEach(el => el.onclick = () => {
    state.syncPaymentMethod = el.dataset.syncPaymentMethod; render();
  });

  const confirmSyncPayment = document.getElementById('confirm-sync-payment');
  if(confirmSyncPayment) confirmSyncPayment.onclick = async () => {
    if(state.syncPaymentMethod === 'card' && !state.savedCard){
      state.pendingSyncPropertyId = state.syncPropertyId;
      state.modal = 'card-form';
      render();
      return;
    }
    await performSync(state.syncPropertyId, state.syncPaymentMethod);
  };

  document.querySelectorAll('[data-rating-service]').forEach(el => el.onclick = () => {
    state.ratingServiceChoice = el.dataset.ratingService; render();
  });
  document.querySelectorAll('[data-rating-staff]').forEach(el => el.onclick = () => {
    state.ratingStaffChoice = el.dataset.ratingStaff; render();
  });
  // GEÇİCİ: personel paneli yazılana kadar müşteri kendi siparişini test
  // amaçlı tamamlandı işaretleyebiliyor.
  const ratingServiceFeedback = document.getElementById('rating-service-feedback');
  if(ratingServiceFeedback) ratingServiceFeedback.oninput = () => { state.ratingServiceFeedback = ratingServiceFeedback.value; };
  const ratingStaffFeedback = document.getElementById('rating-staff-feedback');
  if(ratingStaffFeedback) ratingStaffFeedback.oninput = () => { state.ratingStaffFeedback = ratingStaffFeedback.value; };

  const submitRating = document.getElementById('submit-rating');
  if(submitRating) submitRating.onclick = async () => {
    if(!state.ratingServiceChoice || !state.ratingStaffChoice) return;
    const jobId = submitRating.dataset.job;
    try{
      await api(`/jobs/${jobId}/rate`, { method:'POST', body: JSON.stringify({
        serviceRating: state.ratingServiceChoice,
        serviceFeedback: state.ratingServiceFeedback,
        staffRating: state.ratingStaffChoice,
        staffFeedback: state.ratingStaffFeedback,
      })});
      showToast(t('toastRatingSubmitted'));
      state.ratingJob = null;
      state.ratingServiceChoice = null; state.ratingServiceFeedback = '';
      state.ratingStaffChoice = null; state.ratingStaffFeedback = '';
      await loadAll();
    }catch(err){ showToast(err.message); }
  };

  const skipRating = document.getElementById('skip-rating');
  if(skipRating) skipRating.onclick = () => {
    state.skippedRatingIds.push(skipRating.dataset.job);
    state.ratingJob = findNextRatingJob();
    state.ratingServiceChoice = null; state.ratingServiceFeedback = '';
    state.ratingStaffChoice = null; state.ratingStaffFeedback = '';
    render();
  };

  const chatFab = document.getElementById('chat-fab');
  if(chatFab) chatFab.onclick = async () => {
    state.chatOpen = !state.chatOpen;
    if(state.chatOpen){
      try{ state.chatMessages = await api('/chat/messages'); }catch(err){ /* sessizce geç */ }
    }
    render();
    if(state.chatOpen){
      const body = document.getElementById('chat-panel-body');
      if(body) body.scrollTop = body.scrollHeight;
    }
  };

  const chatInput = document.getElementById('chat-input');
  if(chatInput) chatInput.oninput = () => { state.chatInput = chatInput.value; };

  const chatSend = document.getElementById('chat-send');
  if(chatSend) chatSend.onclick = async () => {
    const text = (state.chatInput || '').trim();
    if(!text) return;
    state.chatInput = '';
    try{
      const msg = await api('/chat/messages', { method:'POST', body: JSON.stringify({ message: text }) });
      state.chatMessages = [...state.chatMessages, msg];
      render();
      const body = document.getElementById('chat-panel-body');
      if(body) body.scrollTop = body.scrollHeight;
    }catch(err){ showToast(err.message); }
  };
}

// Bildirime tıklanıp uygulama zaten açıksa service worker'dan gelen mesajı
// dinleyip Siparişlerim sekmesine geçiyor.
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (event) => {
    if(event.data && event.data.type === 'OPEN_JOBS' && state.token){
      state.page = 'jobs'; render();
    }
  });
}

(async function init(){
  if(state.token && !state.user){
    localStorage.removeItem('token'); state.token = null;
  }
  render();
  if(state.token){
    try{
      await loadAll();
      // Bildirime tıklanıp uygulama kapalıyken açıldıysa (?openJobs=1)
      // doğrudan Siparişlerim sekmesini göster.
      const params = new URLSearchParams(location.search);
      if(params.get('openJobs')){ state.page = 'jobs'; render(); }
    } catch(err){
      localStorage.removeItem('token'); localStorage.removeItem('user');
      state.token = null; render();
    }
  }
})();
</script>
</body>
</html>
