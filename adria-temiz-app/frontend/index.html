<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adria Temiz — Ev Sahibi / Yönetim Paneli</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12303F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy:#12303F;
    --navy-2:#1B4353;
    --sage:#7C9C82;
    --sage-dark:#5B7A62;
    --ochre:#C98A3E;
    --bg:#EEF2EF;
    --panel:#FFFFFF;
    --line:#DCE3DF;
    --text:#16262B;
    --muted:#5C7178;
    --danger:#B5542A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .app{display:flex; min-height:100vh;}

  /* --- Auth ekranı --- */
  .auth-wrap{
    display:flex; align-items:center; justify-content:center;
    width:100%; min-height:100vh; padding:24px;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,156,130,.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,138,62,.18), transparent 45%),
      var(--navy);
  }
  .auth-card{
    width:100%; max-width:420px; background:var(--panel);
    border-radius:16px; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
  .brand .mark{color:var(--ochre); font-size:28px;}
  .brand h1{font-size:24px; color:var(--navy);}
  .tagline{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .tabs{display:flex; gap:4px; background:var(--bg); border-radius:8px; padding:4px; margin-bottom:20px;}
  .tab{flex:1; text-align:center; padding:8px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted);}
  .tab.active{background:var(--navy); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fbfcfb;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .mini-map{width:100%; height:180px; border-radius:8px; border:1px solid var(--line); margin-bottom:6px;}
  .map-hint{font-size:11.5px; color:var(--muted); margin-bottom:14px;}
  .account-type-choice{display:flex; gap:10px; margin-bottom:14px;}
  .option-row{display:flex; gap:10px; margin-bottom:14px;}
  .choice{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px; cursor:pointer;
    text-align:center; font-size:13px; font-weight:600; color:var(--muted);
  }
  .choice.selected{border-color:var(--sage-dark); background:rgba(124,156,130,.12); color:var(--navy);}
  .btn{
    width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.ochre{background:var(--ochre);}
  .btn.ochre:hover{background:#b5792f;}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .error-msg{color:var(--danger); font-size:13px; margin:-6px 0 14px;}
  .hint{font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5;}

  /* --- Panel --- */
  .sidebar{
    width:230px; background:var(--navy); color:#EAF0EE; padding:22px 18px; flex-shrink:0;
    display:flex; flex-direction:column;
  }
  .sidebar .brand{color:#fff; margin-bottom:2px;}
  .sidebar .brand h1{color:#fff; font-size:19px;}
  .account-badge{
    margin-top:6px; margin-bottom:28px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--sage); font-weight:700;
  }
  .nav-item{
    padding:10px 12px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
    color:#C9D6D2; margin-bottom:4px;
  }
  .nav-item.active{background:rgba(255,255,255,.1); color:#fff;}
  .sidebar .spacer{flex:1;}
  .who{font-size:12px; color:#9FB3AE; line-height:1.5; margin-bottom:10px;}
  .logout{font-size:12px; color:#E7B98C; cursor:pointer; text-decoration:underline;}

  .main{flex:1; padding:32px 40px; max-width:1100px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;}
  .page-head h2{font-size:26px; color:var(--navy);}
  .page-head p{color:var(--muted); font-size:13px; margin-top:4px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-bottom:28px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .card h3{font-size:15px; color:var(--navy); margin-bottom:4px;}
  .card .meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .card .price{font-family:'Fraunces',serif; font-size:20px; color:var(--ochre); margin-bottom:12px;}
  .row-actions{display:flex; gap:8px;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:6px;}

  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 14px; background:#F5F8F6; border-bottom:1px solid var(--line);}
  td{padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  .badge.pending{background:#F1E6D3; color:#8A5A19;}
  .badge.assigned{background:#DCE7F5; color:#2C5C8A;}
  .badge.in_progress{background:#E4E0F5; color:#5B3F9E;}
  .badge.done{background:#DEEFE0; color:#2E7D46;}
  .badge.confirmed{background:#CFEAD4; color:#1F6B34;}
  .badge.cancelled{background:#F2DADA; color:#A13A3A;}
  .pay-badge{font-size:11px; font-weight:700;}
  .pay-badge.unpaid{color:var(--muted);}
  .pay-badge.held{color:var(--ochre);}
  .pay-badge.released{color:var(--sage-dark);}
  .empty-state{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:40px; text-align:center; color:var(--muted);
  }
  .toolbar{display:flex; gap:10px; margin-bottom:20px;}
  .toolbar .btn{width:auto; padding:9px 16px;}
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,48,63,.45); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{background:#fff; border-radius:14px; padding:26px; width:100%; max-width:420px;}
  .modal h3{margin-bottom:16px; color:var(--navy);}
  .modal .actions{display:flex; gap:10px; margin-top:18px;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:12px 18px;
    border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60;
  }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
// Yerelde çalışırken backend'e localhost:4000 üzerinden bağlanır.
// Deploy ettiğinde bu satırı gerçek backend adresinle değiştir, örn:
// const API = 'https://api.adriatemiz.com/api';
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000/api'
  : 'https://adria-temiz-app-production.up.railway.app/api';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

let state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  page: 'services',
  properties: { owned: [], delegated: [] },
  jobs: [],
  services: [],
  addons: [],
  // Kayıt formundaki mülk haritasında seçilen konum (geçici, submit'e kadar)
  regLat: null,
  regLng: null,
  // Rezervasyon (sipariş) akışı
  bookingService: null,        // hangi hizmet kartı açık
  bookingPropertyId: null,
  bookingUrgency: 'scheduled', // 'now' | 'urgent' | 'scheduled'
  bookingScheduledAt: '',
  bookingAddons: {},           // { carpet: {checked:true, quantity:2}, ... }
  payingJobId: null,           // Siparişlerim'de hangi satırın ödeme seçenekleri açık
  authStep: 'phone', // 'phone' -> 'otp' -> 'profile' (yalnızca yeni kullanıcı)
  phone: '',
  devCode: '',
  accountTypeChoice: 'individual',
  authError: '',
  modal: null,
};

function render(){ document.getElementById('app').innerHTML = (state.token && state.user) ? renderPanel() : renderAuth(); attachHandlers(); }

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

// Karadağ kıyı şeridini merkez alan, tıklanınca konum seçtiren basit harita.
// Aynı anda tek harita gösterildiği için tek bir instance'ı yeniden kullanıyoruz.
let leafletMapInstance = null;
function initLeafletPickerMap(containerId, onPick, initialLat, initialLng){
  const el = document.getElementById(containerId);
  if(!el || typeof L === 'undefined') return;
  if(leafletMapInstance){ try{ leafletMapInstance.remove(); }catch(e){} leafletMapInstance = null; }
  const startLat = initialLat || 42.43;
  const startLng = initialLng || 18.9;
  const map = L.map(containerId).setView([startLat, startLng], initialLat ? 14 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);
  let marker = initialLat ? L.marker([initialLat, initialLng]).addTo(map) : null;
  map.on('click', (e) => {
    if(marker) marker.remove();
    marker = L.marker(e.latlng).addTo(map);
    onPick(e.latlng.lat, e.latlng.lng);
  });
  leafletMapInstance = map;
  setTimeout(() => map.invalidateSize(), 100);
}

async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers||{}),
    },
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Bir hata oluştu.');
  return data;
}

/* ---------- AUTH: telefon -> SMS kod -> (yeni kullanıcıysa) profil ---------- */
function renderAuth(){
  let inner = '';

  if(state.authStep === 'phone'){
    inner = `
      <div class="tagline">Karadağ kıyısında ev sahipleri ve yönetim şirketleri için tek panel.</div>
      <form id="phone-form">
        <div class="field">
          <label>Telefon numarası</label>
          <input name="phone" type="tel" placeholder="+382 67 123 456" required autofocus />
        </div>
        ${state.authError ? `<div class="error-msg">${state.authError}</div>` : ''}
        <button class="btn ochre" type="submit">Kod gönder</button>
      </form>
      <div class="hint">Şifre yok, e-posta yok — telefonuna gelen 6 haneli kodla giriş yapıyorsun. Yeni numaraysan otomatik hesap açılır.</div>
    `;
  }

  if(state.authStep === 'otp'){
    inner = `
      <div class="tagline">${state.phone} numarasına gönderdiğimiz 6 haneli kodu gir.</div>
      <form id="otp-form">
        <div class="field">
          <label>Doğrulama kodu</label>
          <input name="code" inputmode="numeric" maxlength="6" placeholder="••••••" required autofocus
            style="letter-spacing:6px; font-size:20px; text-align:center;" />
        </div>
        ${state.authError ? `<div class="error-msg">${state.authError}</div>` : ''}
        <button class="btn ochre" type="submit">Doğrula</button>
      </form>
      <div class="hint">
        ${state.devCode ? `Demo modu — gerçek SMS servisi henüz bağlı değil, kodun: <strong>${state.devCode}</strong>` : ''}
      </div>
      <div style="text-align:center; margin-top:10px;">
        <span id="change-phone" style="font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline;">Numarayı değiştir</span>
      </div>
    `;
  }

  if(state.authStep === 'profile'){
    inner = `
      <div class="tagline">Son bir adım — seni tanıyalım.</div>
      <div class="account-type-choice">
        <div class="choice ${state.accountTypeChoice==='individual'?'selected':''}" data-choice="individual">
          Bireysel<br/>ev sahibi
        </div>
        <div class="choice ${state.accountTypeChoice==='company'?'selected':''}" data-choice="company">
          Yönetim<br/>şirketi
        </div>
      </div>
      <form id="profile-form">
        <div class="field"><label>Ad soyad / yetkili adı</label><input name="name" required autofocus /></div>
        ${state.accountTypeChoice==='company' ? `
          <div class="field"><label>Şirket adı</label><input name="companyName" required /></div>
          <div class="hint" style="margin:0 0 14px;">Mülklerini panele girdikten sonra, "Mülklerim" sekmesinden tek tek ekleyebilirsin.</div>
        ` : `
          <div style="border-top:1px solid var(--line); margin:18px 0 14px; padding-top:14px;">
            <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;">
              Mülkün (opsiyonel, sonra da ekleyebilirsin)
            </div>
            <div class="field"><label>Mülk adı</label><input name="propertyName" placeholder="örn. Budva Sahil Daire" /></div>
            <div class="field"><label>Şehir</label><input name="propertyCity" placeholder="örn. Budva, Kotor, Tivat..." /></div>
            <div class="field"><label>Açık adres</label><input name="propertyAddress" placeholder="örn. Njegoseva 12" /></div>
            <div class="field">
              <label>Konum — haritada işaretle</label>
              <div id="reg-map" class="mini-map"></div>
              <div class="map-hint">${state.regLat ? `Seçildi: ${state.regLat.toFixed(5)}, ${state.regLng.toFixed(5)}` : 'Personelin doğru adrese gitmesi için haritaya tıkla.'}</div>
            </div>
            <div class="field"><label>Büyüklük (m²)</label><input name="sizeSqm" type="number" min="1" placeholder="örn. 75" /></div>
          </div>
        `}
        ${state.authError ? `<div class="error-msg">${state.authError}</div>` : ''}
        <button class="btn ochre" type="submit">Panele gir</button>
      </form>
    `;
  }

  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="mark">◆</span><h1>Adria Temiz</h1></div>
      ${inner}
    </div>
  </div>`;
}

/* ---------- PANEL ---------- */
function renderPanel(){
  const isCompany = state.user.accountType === 'company';
  return `
  <div class="sidebar">
    <div class="brand"><span class="mark" style="color:#E7B98C">◆</span><h1>Adria Temiz</h1></div>
    <div class="account-badge">${isCompany ? 'Yönetim Şirketi' : 'Bireysel Ev Sahibi'}</div>
    <div class="nav-item ${state.page==='services'?'active':''}" data-page="services">Hizmetler</div>
    <div class="nav-item ${state.page==='properties'?'active':''}" data-page="properties">Mülklerim</div>
    <div class="nav-item ${state.page==='jobs'?'active':''}" data-page="jobs">Siparişlerim</div>
    <div class="spacer"></div>
    <div class="who">${state.user.companyName || state.user.name}<br/>${state.user.phone}</div>
    <div class="logout" id="logout">Çıkış yap</div>
  </div>
  <div class="main">
    ${state.page==='services' ? renderServices() : state.page==='properties' ? renderProperties() : renderJobs()}
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}

function calcPriceClient(service, { sizeSqm } = {}){
  const price = service.base + (Number(sizeSqm)||0) * service.rate;
  return Math.max(service.min, Math.round(price/5)*5);
}

function bookingAddonsTotal(){
  let total = 0;
  Object.entries(state.bookingAddons).forEach(([key, val]) => {
    if(val && val.checked){
      const addon = state.addons.find(a => a.key === key);
      if(addon) total += addon.rate * Math.max(1, Number(val.quantity)||1);
    }
  });
  return total;
}

function renderServices(){
  const props = [...state.properties.owned, ...state.properties.delegated];
  const selectedProperty = props.find(p => p.id === state.bookingPropertyId) || props[0];

  if(props.length === 0){
    return `
    <div class="page-head"><div><h2>Hizmetler</h2><p>İhtiyacına göre bir hizmet seç, fiyatı anında gör.</p></div></div>
    <div class="empty-state">
      Hizmet talep etmeden önce bir mülk eklemen lazım.
      <div style="margin-top:12px;"><button class="btn ochre btn-sm" id="goto-add-property">+ Mülk ekle</button></div>
    </div>`;
  }

  return `
  <div class="page-head">
    <div>
      <h2>Hizmetler</h2>
      <p>İhtiyacına göre bir hizmet seç, zamanlamasını ve ekstralarını belirle, siparişini tamamla.</p>
    </div>
  </div>
  <div class="grid">
    ${state.services.map(s => {
      const preview = calcPriceClient(s, { sizeSqm: selectedProperty?.size_sqm });
      const isOpen = state.bookingService === s.key;
      return `
      <div class="card" style="${isOpen ? 'border-color:var(--sage-dark); border-width:1.5px;' : ''}">
        <h3>${s.name}</h3>
        <div class="meta" style="margin-bottom:10px;">${s.description}</div>
        <div class="price">${preview} €${selectedProperty?.size_sqm ? `<span style="font-size:12px;color:var(--muted);font-family:Inter"> · ${selectedProperty.size_sqm} m²</span>` : ''}</div>
        <div class="row-actions">
          <button class="btn ${isOpen?'ochre':'ghost'} btn-sm" data-toggle-service="${s.key}">${isOpen ? 'Kapat' : 'Talep oluştur'}</button>
        </div>
        ${isOpen ? renderBookingPanel(s, props, selectedProperty) : ''}
      </div>
    `}).join('')}
  </div>
  `;
}

function renderBookingPanel(service, props, selectedProperty){
  const addonChecked = (key) => state.bookingAddons[key]?.checked;
  const addonQty = (key) => state.bookingAddons[key]?.quantity || 1;
  const total = calcPriceClient(service, { sizeSqm: selectedProperty?.size_sqm }) + bookingAddonsTotal();

  return `
  <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
    ${props.length > 1 ? `
      <div class="field">
        <label>Mülk</label>
        <select id="booking-property-select">
          ${props.map(p => `<option value="${p.id}" ${p.id===selectedProperty.id?'selected':''}>${p.name}${p.size_sqm ? ' ('+p.size_sqm+' m²)' : ''}</option>`).join('')}
        </select>
      </div>
    ` : ''}

    <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;">Ne zaman?</div>
    <div class="option-row">
      <div class="choice ${state.bookingUrgency==='now'?'selected':''}" data-urgency="now">Şimdi</div>
      <div class="choice ${state.bookingUrgency==='urgent'?'selected':''}" data-urgency="urgent">⚡ Acil</div>
      <div class="choice ${state.bookingUrgency==='scheduled'?'selected':''}" data-urgency="scheduled">Planla</div>
    </div>
    ${state.bookingUrgency==='scheduled' ? `
      <div class="field">
        <label>Tarih ve saat</label>
        <input type="datetime-local" id="booking-datetime" value="${state.bookingScheduledAt}" />
      </div>
    ` : ''}

    <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 8px;">Ekstra hizmetler</div>
    ${state.addons.map(a => `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:8px; flex:1; font-size:13px; cursor:pointer;">
          <input type="checkbox" data-addon-toggle="${a.key}" ${addonChecked(a.key) ? 'checked' : ''} />
          ${a.name} <span style="color:var(--muted); font-size:12px;">(+${a.rate}€/${a.unitLabel})</span>
        </label>
        ${addonChecked(a.key) ? `<input type="number" min="1" data-addon-qty="${a.key}" value="${addonQty(a.key)}" style="width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;" />` : ''}
      </div>
    `).join('')}

    <div class="price" style="margin:14px 0;">${total} € <span style="font-size:12px;color:var(--muted);font-family:Inter">toplam · ödeme hizmet tamamlanınca alınır</span></div>
    <button class="btn ochre btn-sm" style="width:100%;" data-confirm-booking="${service.key}">Siparişi Oluştur</button>
  </div>
  `;
}

function renderProperties(){
  const props = [...state.properties.owned, ...state.properties.delegated];
  return `
  <div class="page-head">
    <div>
      <h2>Mülklerim</h2>
      <p>Airbnb/Booking iCal linkini ekleyip her check-out için otomatik temizlik talebi oluştur.</p>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn ochre" id="add-property">+ Mülk ekle</button>
  </div>
  ${props.length === 0 ? `
    <div class="empty-state">Henüz mülk eklenmedi. Başlamak için "Mülk ekle" butonunu kullan.</div>
  ` : `
    <div class="grid">
      ${props.map(p => `
        <div class="card">
          <h3>${p.name}</h3>
          <div class="meta" style="margin-bottom:14px;">${p.city || 'Şehir belirtilmedi'}${p.size_sqm ? ' · ' + p.size_sqm + ' m²' : ''}${p.ical_url ? ' · iCal bağlı' : ' · iCal bağlı değil (demo verisiyle senkronla)'}</div>
          <div class="row-actions">
            <button class="btn ochre btn-sm" data-book="${p.id}">Hizmet talep et</button>
            <button class="btn ghost btn-sm" data-sync="${p.id}">Takvimi senkronla (demo)</button>
          </div>
        </div>
      `).join('')}
    </div>
  `}
  `;
}

const STATUS_LABELS = {
  pending:'Bekliyor', assigned:'Atandı', in_progress:'Devam ediyor',
  done:'Tamamlandı', confirmed:'Onaylandı', cancelled:'İptal',
};
const PAY_LABELS = { unpaid:'Ödenmedi', held:'Emanette', released:'Serbest bırakıldı', refunded:'İade edildi' };

function serviceName(key){
  const s = state.services.find(x => x.key === key);
  return s ? s.name : key;
}

function renderJobs(){
  return `
  <div class="page-head">
    <div>
      <h2>Siparişlerim</h2>
      <p>Aldığın hizmetler ve durumları.</p>
    </div>
  </div>
  ${state.jobs.length === 0 ? `
    <div class="empty-state">Henüz sipariş yok. "Hizmetler" sekmesinden bir sipariş oluştur.</div>
  ` : `
    <table>
      <thead><tr>
        <th>Mülk</th><th>Hizmet</th><th>Zaman</th><th>Durum</th><th>Fiyat</th><th></th>
      </tr></thead>
      <tbody>
        ${state.jobs.map(j => `
          <tr>
            <td><strong>${j.property_name}</strong><br/><span style="color:var(--muted);font-size:12px">${j.property_city||''}</span></td>
            <td>${serviceName(j.service_key)}${renderAddonsSummary(j.addons)}</td>
            <td>${j.urgency==='urgent' ? '⚡ Acil' : j.urgency==='now' ? 'Şimdi' : new Date(j.checkout_at).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'})}</td>
            <td><span class="badge ${j.status}">${STATUS_LABELS[j.status]}</span></td>
            <td>${j.price} €</td>
            <td>${renderJobAction(j)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `}
  `;
}

function renderJobAction(j){
  if(j.payment_status === 'released'){
    return `<span class="pay-badge released">✓ Ödendi</span>`;
  }
  if(!['done','confirmed'].includes(j.status)){
    return `<button class="btn ghost btn-sm" data-mark-done="${j.id}">Tamamlandı olarak işaretle</button>`;
  }
  if(state.payingJobId === j.id){
    return `
      <div style="display:flex; gap:6px;">
        <button class="btn ochre btn-sm" data-pay-method="cash" data-pay-job="${j.id}">💵 Nakit</button>
        <button class="btn ochre btn-sm" data-pay-method="card" data-pay-job="${j.id}">💳 Kart</button>
      </div>`;
  }
  return `<button class="btn ochre btn-sm" data-open-pay="${j.id}">Öde</button>`;
}

function renderAddonsSummary(addonsJson){
  if(!addonsJson) return '';
  try{
    const list = JSON.parse(addonsJson);
    return list.map(a => {
      const addon = state.addons.find(x => x.key === a.key);
      return ` <span style="color:var(--muted); font-size:12px;">+ ${addon ? addon.name : a.key} (${a.quantity})</span>`;
    }).join('');
  }catch(e){ return ''; }
}

function renderModal(){
  if(state.modal === 'add-property'){
    return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>Yeni mülk ekle</h3>
        <form id="property-form">
          <div class="field"><label>Mülk adı</label><input name="name" required placeholder="örn. Kotor Eski Şehir Stüdyo" /></div>
          <div class="field"><label>Şehir</label><input name="city" placeholder="örn. Kotor" /></div>
          <div class="field"><label>Açık adres</label><input name="address" placeholder="örn. Stari Grad 45" /></div>
          <div class="field">
            <label>Konum — haritada işaretle</label>
            <div id="modal-map" class="mini-map"></div>
            <div class="map-hint">${state.regLat ? `Seçildi: ${state.regLat.toFixed(5)}, ${state.regLng.toFixed(5)}` : 'Personelin doğru adrese gitmesi için haritaya tıkla.'}</div>
          </div>
          <div class="field"><label>Büyüklük (m²)</label><input name="sizeSqm" type="number" min="1" placeholder="örn. 75" /></div>
          <div class="field"><label>Airbnb/Booking iCal linki (opsiyonel)</label><input name="icalUrl" placeholder="https://www.airbnb.com/calendar/ical/....ics" /></div>
          <div class="actions">
            <button type="button" class="btn ghost" id="modal-cancel">Vazgeç</button>
            <button type="submit" class="btn ochre">Ekle</button>
          </div>
        </form>
      </div>
    </div>`;
  }
  return '';
}

/* ---------- DATA LOADING ---------- */
async function loadAll(){
  const calls = [ api('/properties'), api('/jobs') ];
  if(state.services.length === 0) calls.push(api('/services'));
  const results = await Promise.all(calls);
  state.properties = results[0];
  state.jobs = results[1];
  if(results[2]){ state.services = results[2].services; state.addons = results[2].addons; }
  render();
}

/* ---------- EVENTS ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-choice]').forEach(el => el.onclick = () => {
    state.accountTypeChoice = el.dataset.choice; render();
  });

  // Kayıt formunda mülk haritası (yalnızca bireysel + profil adımındaysa var)
  initLeafletPickerMap('reg-map', (lat, lng) => {
    state.regLat = lat; state.regLng = lng;
    const hint = document.querySelector('#reg-map ~ .map-hint');
    if(hint) hint.textContent = `Seçildi: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }, state.regLat, state.regLng);

  // Panelden "Mülk ekle" modalındaki harita
  initLeafletPickerMap('modal-map', (lat, lng) => {
    state.regLat = lat; state.regLng = lng;
    const hint = document.querySelector('#modal-map ~ .map-hint');
    if(hint) hint.textContent = `Seçildi: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }, state.regLat, state.regLng);

  // 1) Telefon gönder -> kod iste
  const phoneForm = document.getElementById('phone-form');
  if(phoneForm) phoneForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(phoneForm));
    try{
      const data = await api('/auth/request-otp', { method:'POST', body: JSON.stringify({ phone: fd.phone }) });
      state.phone = fd.phone;
      state.devCode = data.devCode || '';
      state.authStep = 'otp';
      state.authError = '';
      render();
    }catch(err){ state.authError = err.message; render(); }
  };

  // 2) Kodu doğrula -> yeni kullanıcıysa profil adımına geç, değilse direkt panele gir
  const otpForm = document.getElementById('otp-form');
  if(otpForm) otpForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(otpForm));
    try{
      const data = await api('/auth/verify-otp', { method:'POST', body: JSON.stringify({ phone: state.phone, code: fd.code }) });
      state.token = data.token;
      localStorage.setItem('token', data.token);
      if(data.isNewUser){
        state.authStep = 'profile';
        state.authError = '';
        render();
      } else {
        state.user = data.user;
        localStorage.setItem('user', JSON.stringify(data.user));
        state.authError = '';
        await loadAll();
      }
    }catch(err){ state.authError = err.message; render(); }
  };

  const changePhone = document.getElementById('change-phone');
  if(changePhone) changePhone.onclick = () => { state.authStep = 'phone'; state.authError = ''; render(); };

  // 3) Profili tamamla (yalnızca yeni kullanıcı) -> Hizmetler ekranına gir
  const profileForm = document.getElementById('profile-form');
  if(profileForm) profileForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(profileForm));
    const body = { name: fd.name, accountType: state.accountTypeChoice, companyName: fd.companyName };
    if(state.accountTypeChoice === 'individual' && (fd.propertyCity || fd.sizeSqm || fd.propertyName)){
      body.property = {
        name: fd.propertyName || 'Evim',
        city: fd.propertyCity || null,
        address: fd.propertyAddress || null,
        sizeSqm: fd.sizeSqm || null,
        latitude: state.regLat,
        longitude: state.regLng,
      };
    }
    try{
      const data = await api('/auth/complete-profile', { method:'POST', body: JSON.stringify(body) });
      state.token = data.token; state.user = data.user;
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      state.authError = '';
      state.page = 'services';
      state.regLat = null; state.regLng = null;
      if(data.property) showToast(`Hoş geldin! "${data.property.name}" mülkün eklendi.`);
      await loadAll();
    }catch(err){ state.authError = err.message; render(); }
  };

  document.querySelectorAll('[data-page]').forEach(el => el.onclick = async () => {
    state.page = el.dataset.page; await loadAll();
  });

  const logout = document.getElementById('logout');
  if(logout) logout.onclick = () => {
    localStorage.removeItem('token'); localStorage.removeItem('user');
    state.token = null; state.user = null; state.authStep = 'phone'; render();
  };

  const addPropBtn = document.getElementById('add-property');
  if(addPropBtn) addPropBtn.onclick = () => { state.modal = 'add-property'; state.regLat = null; state.regLng = null; render(); };

  const gotoAddProperty = document.getElementById('goto-add-property');
  if(gotoAddProperty) gotoAddProperty.onclick = () => { state.page='properties'; state.modal='add-property'; render(); };

  document.querySelectorAll('[data-toggle-service]').forEach(el => el.onclick = () => {
    const key = el.dataset.toggleService;
    state.bookingService = state.bookingService === key ? null : key;
    state.bookingUrgency = 'scheduled';
    state.bookingScheduledAt = '';
    state.bookingAddons = {};
    if(!state.bookingPropertyId){
      const props = [...state.properties.owned, ...state.properties.delegated];
      state.bookingPropertyId = props[0]?.id || null;
    }
    render();
  });

  const bookingPropertySelect = document.getElementById('booking-property-select');
  if(bookingPropertySelect) bookingPropertySelect.onchange = () => {
    state.bookingPropertyId = bookingPropertySelect.value; render();
  };

  document.querySelectorAll('[data-urgency]').forEach(el => el.onclick = () => {
    state.bookingUrgency = el.dataset.urgency; render();
  });

  const bookingDatetime = document.getElementById('booking-datetime');
  if(bookingDatetime) bookingDatetime.onchange = () => {
    state.bookingScheduledAt = bookingDatetime.value;
  };

  document.querySelectorAll('[data-addon-toggle]').forEach(el => el.onchange = () => {
    const key = el.dataset.addonToggle;
    const current = state.bookingAddons[key] || { quantity: 1 };
    state.bookingAddons = { ...state.bookingAddons, [key]: { ...current, checked: el.checked } };
    render();
  });
  document.querySelectorAll('[data-addon-qty]').forEach(el => el.oninput = () => {
    const key = el.dataset.addonQty;
    const current = state.bookingAddons[key] || { checked: true };
    state.bookingAddons = { ...state.bookingAddons, [key]: { ...current, quantity: Number(el.value)||1 } };
    render();
  });

  document.querySelectorAll('[data-confirm-booking]').forEach(el => el.onclick = async () => {
    const serviceKey = el.dataset.confirmBooking;
    const props = [...state.properties.owned, ...state.properties.delegated];
    const propertyId = state.bookingPropertyId || props[0]?.id;
    if(!propertyId) return;
    if(state.bookingUrgency === 'scheduled' && !state.bookingScheduledAt){
      showToast('Lütfen bir tarih/saat seç.'); return;
    }
    const addons = Object.entries(state.bookingAddons)
      .filter(([, v]) => v && v.checked)
      .map(([key, v]) => ({ key, quantity: v.quantity || 1 }));
    try{
      await api('/jobs', { method:'POST', body: JSON.stringify({
        propertyId, serviceKey,
        urgency: state.bookingUrgency,
        scheduledAt: state.bookingUrgency === 'scheduled' ? state.bookingScheduledAt : undefined,
        addons,
      })});
      state.bookingService = null;
      state.page = 'jobs';
      await loadAll();
      showToast('Siparişin oluşturuldu. Hizmet tamamlanınca ödeme adımı açılacak.');
    }catch(err){ showToast(err.message); }
  });

  const modalCancel = document.getElementById('modal-cancel');
  if(modalCancel) modalCancel.onclick = () => { state.modal = null; state.regLat = null; state.regLng = null; render(); };

  const propForm = document.getElementById('property-form');
  if(propForm) propForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(propForm));
    await api('/properties', { method:'POST', body: JSON.stringify({
      name: fd.name, city: fd.city, address: fd.address || null,
      latitude: state.regLat, longitude: state.regLng,
      sizeSqm: fd.sizeSqm || null, icalUrl: fd.icalUrl || null,
    })});
    state.modal = null;
    state.regLat = null; state.regLng = null;
    await loadAll();
    showToast('Mülk eklendi.');
  };

  document.querySelectorAll('[data-book]').forEach(el => el.onclick = () => {
    state.bookingPropertyId = el.dataset.book;
    state.page = 'services';
    render();
  });

  document.querySelectorAll('[data-sync]').forEach(el => el.onclick = async () => {
    const SAMPLE_ICS = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Airbnb Inc//Hosting Calendar//EN
BEGIN:VEVENT
UID:demo-${Date.now()}-1@airbnb.com
DTSTAMP:20260701T000000Z
DTSTART:20260805T140000Z
DTEND:20260810T100000Z
SUMMARY:Reserved
END:VEVENT
BEGIN:VEVENT
UID:demo-${Date.now()}-2@airbnb.com
DTSTAMP:20260701T000000Z
DTSTART:20260812T140000Z
DTEND:20260815T100000Z
SUMMARY:Reserved
END:VEVENT
END:VCALENDAR`;
    const result = await api(`/properties/${el.dataset.sync}/sync`, { method:'POST', body: JSON.stringify({ icsText: SAMPLE_ICS }) });
    showToast(`Senkron tamam: ${result.created} yeni temizlik işi oluşturuldu.`);
    state.page = 'jobs';
    await loadAll();
  });

  document.querySelectorAll('[data-mark-done]').forEach(el => el.onclick = async () => {
    await api(`/jobs/${el.dataset.markDone}/status`, { method:'PATCH', body: JSON.stringify({ status:'done' }) });
    showToast('Hizmet tamamlandı olarak işaretlendi. Şimdi ödeyebilirsin.');
    await loadAll();
  });
  document.querySelectorAll('[data-open-pay]').forEach(el => el.onclick = () => {
    state.payingJobId = el.dataset.openPay; render();
  });
  document.querySelectorAll('[data-pay-job]').forEach(el => el.onclick = async () => {
    await api(`/jobs/${el.dataset.payJob}/complete-payment`, {
      method:'POST', body: JSON.stringify({ paymentMethod: el.dataset.payMethod }),
    });
    state.payingJobId = null;
    showToast('Ödeme tamamlandı.');
    await loadAll();
  });
}

/* ---------- INIT ---------- */
(async function init(){
  if(state.token && !state.user){
    // Profil tamamlama adımında yarım kalmış olabilir - güvenli şekilde baştan başlat.
    localStorage.removeItem('token'); state.token = null;
  }
  render();
  if(state.token){
    try{ await loadAll(); } catch(err){
      localStorage.removeItem('token'); localStorage.removeItem('user');
      state.token = null; render();
    }
  }
})();
</script>
</body>
</html>
